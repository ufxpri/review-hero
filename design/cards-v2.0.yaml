# ============================================================================
# 이세계 리뷰용사 — 카드 데이터 v2.0 (정본)
# 근거: card-system-v2.md (대상 → 리뷰 / 단일 초점 / 원산지 보너스)
# 대체: cards-v1.0.yaml (조합형. v1은 이력 보존용으로 유지)
# 용어: worldview-v1.0.md §6 사전 준수 — 필력·의지·신뢰도·만물대장
# 총 60장 = 전생 12 + 적 19 + 구성품 20 + 진상 화법 9
# ⚠ 밸런스 미검증: 모든 수치는 잠정값. 재시뮬(밸런스 라운드 1-v2)로 확정한다.
# ============================================================================
#
# ── 스키마 ──────────────────────────────────────────────────
#   id: string          # Z(전생) / 적·구성품별 접두 / X(진상 화법)
#   name: string        # 카드명 (UI 표기)
#   origin:             # 원산지. 없으면 원산지 판정 영구 미발동
#     enemy: string     #   적 id. 적 본체 대상 제출 시 일치 판정
#     equipment: string #   구성품명. 구성품 대상 제출 시 일치 판정
#   suit: 품질|성능|배송|감성   # 성향 산정 기준 (GDD §3.5)
#   tag: string         # 판정 태그 정확히 1개 (단일 초점 원칙 — 배열 금지)
#   cost: int           # 필력. 최소 1 (예외: X03·X07만 0, 의지 피해 없음)
#   stars: 1..5         # ★ 표기. 4 이상 = 찬양 리뷰 = 버프 계열 (card-system-v2 §6)
#   rarity: basic|common|rare|legendary
#   target: enemy|enemy_equipment|my_equipment
#   text: string        # ★ 리뷰 본문. UI 정본 — 이 필드가 게임의 얼굴이다
#   effect: {type, value, ...}
#   ui: string          # 효과 요약 1줄 (본문과 분리)
#   no_judgement: true  # 진상 화법 — 태그 판정 없음
#   unique: true        # 덱 1장 제한
#   layer: int          # 도입 레이어. 생략 시 1 (MVP)
#
# ── 판정 4단계 (card-system-v2 §2) ─────────────────────────
#   원산지  대상 == origin        ×1.5 + 고정 +1, 게이지 +4, 무효 태그 무시
#   팩트    tag ∈ weakness_tags   ×1.5,           게이지 +3
#   일반    그 외                  ×1.0,           게이지  0
#   헛소리  tag ∈ null_tags       ×0.5,           게이지 −2
#   배율은 effect.value에 곱한다(내림, 최소 1 — GDD §2-1).
#
# ── effect type (v1에서 승계, 시뮬레이터 구현 대상) ────────
#   damage / equipment_damage / equipment_dot / disable_equipment /
#   weaken_next_action / stun / remove_enemy_buff / attack_down / damage_buff /
#   draw / energy_next_turn / heal / gauge / delay_enemy_action / create_card /
#   gift_card / store_damage_taken / reaction_counter / retreat / damage_per_penalty
# ============================================================================


# ── 시작 덱 (12장 = 전생 상품 리뷰 전량) ─────────────────────
# 전부 irremovable. 원산지가 이 세계에 존재하지 않아 원산지 보너스가 영구 미발동한다.
# 시작 카드가 왜 약한지가 세계관으로 해명되는 지점 (card-system-v2 §1).
starting_deck:
  - { id: Z01, irremovable: true }
  - { id: Z02, irremovable: true }
  - { id: Z03, irremovable: true }
  - { id: Z04, irremovable: true }
  - { id: Z05, irremovable: true }
  - { id: Z06, irremovable: true }
  - { id: Z07, irremovable: true }
  - { id: Z08, irremovable: true }
  - { id: Z09, irremovable: true }
  - { id: Z10, irremovable: true }
  - { id: Z11, irremovable: true }
  - { id: Z12, irremovable: true }


