# ============================================================================
# 장비 리뷰 — 적 구성품 18장(T07~T12) + 내 장비 18장(T17~T19)
# ⚠ 섹션 키가 `equipment_reviews` 하나인 것은 로더가 고정 4개 섹션만 읽기 때문이다
#   (packages/sim/src/data.ts). 대상 구분은 카드의 target 필드가 정본이다.
# ============================================================================
equipment_reviews:

  # ==========================================================================
  # 적 구성품 (T07~T12) — 18장 · target: enemy_equipment
  # 전부 origin.equipment 보유 → 그 구성품 앞에서 원산지가 터진다.
  # 효과 type이 damage인 카드는 「구성품을 리뷰해서 주인의 의지를 깎는다」는 뜻이다.
