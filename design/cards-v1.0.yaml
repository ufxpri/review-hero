suffixes:
  # ── 데미지계 (적 본체 의지 대상) ───────────────
  - id: S01
    name: "…쓰레기네요."
    type: damage
    target: enemy
    cost: 1
    text: "의지 데미지 6"
    effect: { type: damage, value: 6 }
  - id: S02
    name: "…돈이 아깝습니다."
    type: damage
    target: enemy
    cost: 2
    text: "의지 데미지 9"
    effect: { type: damage, value: 9 }
  - id: S03
    name: "…실망입니다. 또 실망입니다."
    type: damage
    target: enemy
    cost: 1
    text: "의지 3, 2회 판정"           # GDD §3.7 재서술 — 개발자 주석 톤 제거
    effect: { type: damage, value: 3, hits: 2 }   # 판정·게이지는 히트당 (GDD §3.3)
  - id: S04
    name: "…별 반 개도 아깝네요."
    type: damage
    target: enemy
    cost: 2
    excluded_from_act1_rewards: true   # 게이지 감소 카드 (GDD §3.6)
    text: "의지 데미지 12, 신뢰도 -1"
    effect: { type: damage, value: 12, gauge: -1 }

  # ── 장비계 (적 장비 대상) ─────────────────────
  - id: S05
    name: "…처참합니다."
    type: equipment
    target: enemy_equipment
    cost: 1
    text: "장비 내구도 -4"
    effect: { type: equipment_damage, value: 4 }
  - id: S06
    name: "…수리가 시급합니다."
    type: equipment
    target: enemy_equipment
    cost: 1
    text: "장비 내구도 도트: 매턴 -2, 2턴"
    effect: { type: equipment_dot, value: 2, duration: 2 }
  - id: S07
    name: "…반품합니다."
    type: equipment
    target: enemy_equipment
    cost: 2
    text: "장비 1개 1턴 비활성화 (해당 행동 봉인)"
    effect: { type: disable_equipment, duration: 1 }
  - id: S08
    name: "…불량입니다."
    type: equipment
    target: enemy_equipment
    cost: 2
    text: "적의 다음 행동 위력 -50%"
    effect: { type: weaken_next_action, value: -50 }

  # ── 방해계 (상태이상/제어) ─────────────────────
  - id: S09
    name: "…고소합니다."
    type: control
    target: enemy
    cost: 3
    unique: true                        # 유니크 — 연쇄 락 차단 (GDD §3.7, 기절 규칙 §3.2)
    text: "기절 1턴"
    effect: { type: stun, duration: 1 }
  - id: S10
    name: "…환불 요청합니다."
    type: control
    target: enemy
    cost: 1
    text: "적 버프 1개 제거"
    effect: { type: remove_enemy_buff, value: 1 }
  - id: S11
    name: "…그럭저럭 쓸만하네요."
    type: control
    target: enemy
    cost: 0
    excluded_from_act1_rewards: true   # 게이지 감소 카드 (GDD §3.6)
    text: "의지 데미지 1, 신뢰도 -1"
    effect: { type: damage, value: 1, gauge: -1 }
  - id: S12
    name: "…두 번 다시 안 삽니다."
    type: control
    target: enemy
    cost: 2
    text: "적 공격력 -2 (전투 내 지속)"
    effect: { type: attack_down, value: 2, duration: combat }

  # ── 버프계 (5성 리뷰 — 반드시 내 장비 1개를 대상 지정, GDD §3.3) ──
  # 접두 태그 vs 내 장비 태그로 동일 판정. 적중 시 수치 ×1.5(내림)+게이지 +2.
  # 온보딩 1판 한정 무판정(항상 일반), 2판부터 판정 개방.
  - id: S13
    name: "…인생템입니다."
    type: buff
    target: my_equipment
    cost: 1
    text: "내 장비에 부착: 내 리뷰 데미지 +2 (전투 내 지속)"
    effect: { type: damage_buff, value: 2, duration: combat, per_submission: true, uses_attach_slot: true }
    # per_submission: 가산은 제출당 1회 — S03 등 다중 히트에 히트당 적용 금지 (GDD §3.3)
    # uses_attach_slot: 부착 슬롯 2칸을 악평 토큰(L2)과 공유 (GDD §3.9, R15)
  - id: S14
    name: "…사장님이 미쳤어요."
    type: buff
    target: my_equipment
    cost: 1
    text: "카드 2장 드로우"
    effect: { type: draw, value: 2 }
  - id: S15
    name: "…재구매 의사 있습니다."
    type: buff
    target: my_equipment
    cost: 1
    text: "다음 턴 필력 +1"
    effect: { type: energy_next_turn, value: 1 }   # 이월이 아니라 다음 턴 가산 (GDD §2-3)
  - id: S16
    name: "…믿고 쓰는 브랜드죠."
    type: buff
    target: my_equipment
    cost: 1
    text: "의지 회복 5"
    effect: { type: heal, value: 5 }

specials:
  # 완성형 진상 카드. 단독 사용. 전 카드 no_judgement — UI에 "무판정" 뱃지 (GDD §3.7).
  - id: X01
    name: "배송 지연"
    flavor: "아직도 안 왔어요. 별 1개."
    cost: 2
    no_judgement: true
    excluded_from_act1_rewards: true   # 게이지 감소 카드 (GDD §3.6)
    text: "적의 다음 행동을 1턴 지연, 신뢰도 -1"
    effect: { type: delay_enemy_action, duration: 1, gauge: -1 }
  - id: X02
    name: "별점 테러"
    flavor: "안 써봤지만 태도가 맘에 안 들어서 1점."
    cost: 3
