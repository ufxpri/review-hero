# 이세계 리뷰용사 — 카드 데이터 v1.0
# 정본: GDD-v1.0.md §2(공통 계산), §3.3(태그 판정), §3.6(덱 규칙), §3.7(카드 변경표)
# 용어: worldview-v1.0.md §6 사전 준수 (UI 표기는 ui_* 필드의 문자열이 정본)
# 총 41장 = 접두 16 + 접미 16 + 특수 9 (X09는 Layer 2 카드 — MVP 40장 + X09)
#
# ──────────────────────────────────────────────────────────────
# 스키마 정의 (시뮬레이터 파싱 전제)
#
# 공통 필드
#   id: string                  # P/S/X + 번호
#   name: string                # 카드명 (UI 표기)
#   cost: int                   # 필력 비용 (UI 표기 "필력", GDD §2-3)
#   layer: int                  # 도입 레이어. 생략 시 1 (MVP). X09만 2
#   unique: bool                # 덱 1장 제한 (GDD §3.6: X08/X04/S09/X09)
#   text: string                # 사람용 효과 서술 (UI 본문)
#   flavor: string              # 플레이버 텍스트 (특수 카드)
#
# 접두(prefixes) 전용
#   suit: 품질|성능|배송|감성    # 계열 (크리티컬 성향 카운터의 기준)
#   tag: string | [string]      # 판정 태그. 배열이면 하나라도 적중 시 팩트
#   footer: string              # 하단 고정 서식 (GDD §3.7 — 전 접두 필수)
#   modifier:                   # 조합 효과 보정 (0~1개, 기계용)
#     type: string              # 아래 modifier type 목록 참조
#     value: number
#     condition: string         # 발동 조건 키 (없으면 상시)
#
# 접미(suffixes) 전용
#   type: damage|equipment|control|buff
#   target: enemy|enemy_equipment|my_equipment   # buff는 반드시 my_equipment (GDD §3.3)
#   effect:                     # 기계용 효과. 판정 배율(×1.5/×1.0/×0.5)은 시뮬레이터가
#     type: string              #   value에 곱한다(내림, 최소 1 — GDD §2-1)
#     value: number             # 기본 수치
#     hits: int                 # 다중 히트 수 (생략 시 1). 판정·게이지는 히트당 (GDD §3.3)
#     duration: int|combat      # 지속 턴 수 / combat = 전투 내
#     per_submission: bool      # true면 가산 적용이 "제출당 1회" (히트당 아님, GDD §3.3)
#     uses_attach_slot: bool    # 장비 부착 슬롯 2칸 소모 (GDD §3.9, L2 악평 토큰과 공유)
#     gauge: int                # 부가 게이지 증감(±). §3.4 표의 소스/싱크와 1:1 대응
#     (type별 부가 필드 허용: target_scope·pool·multiplier·removed_for_run·
#      weaken_pct·reflect_pct·condition·per_point·cap_points — 해당 type 정의 참조)
#
# 특수(specials) 전용
#   no_judgement: true          # 무판정 — 태그 판정 없음. UI에 "무판정" 뱃지 (GDD §3.7)
#   once_per_combat: bool       # 전투당 1회
#   effect: { type, value, ... }  # 접미와 동일 구조
#
# 획득 제한 필드
#   excluded_from_act1_rewards: true  # 시작 덱·1막 보상 풀 제외 (GDD §3.6 — 게이지 감소 카드)
#
# effect/modifier type 목록 (시뮬레이터 구현 대상)
#   damage                의지 데미지 value
#   equipment_damage      장비 내구도 -value
#   equipment_dot         장비 내구도 도트: 매턴 -value, duration턴
#   disable_equipment     장비 1개 duration턴 비활성화
#   weaken_next_action    적의 다음 행동 위력 value% (음수)
#   stun                  기절 duration턴 (기절 규칙 GDD §3.2 — 경직 내성·기믹 무시)
#   remove_enemy_buff     적 버프 value개 제거
#   attack_down           적 공격력 -value (duration: combat)
#   damage_buff           내 리뷰 데미지 +value (부착 버프)
#   draw                  카드 value장 드로우
#   energy_next_turn      다음 턴 필력 +value (이월 아님 — GDD §2-3)
#   heal                  의지 회복 value
#   gauge                 신뢰도 게이지 ±value (0~10 클램프 — GDD §2-2)
#   delay_enemy_action    적의 다음 행동 1턴 지연
#   create_card           풀(pool)에서 무작위 카드 value장 손패 생성
#   gift_card             손패 1장 증정(런 제외) 후 그 비용 ×multiplier 의지 데미지
#   store_damage_taken    이번 턴 받은 피해량을 다음 리뷰 데미지에 가산 예약
#   reaction_counter      리액션 설치 (X06 — GDD §3.2 규칙 고정)
#   retreat               전투 이탈 (보상 포기)
#   damage_per_penalty    악평 페널티 합 Σp(상한 cap_points) × per_point 의지 데미지
#   bonus_equipment_damage / extend_slow / extend_dot / vs_casting_mult / no_fumble /
#   vs_summon_mult / target_enemy_support / draw_on_fact / bonus_damage /
#   vs_gimmick_mult / vs_boss_mult   — 접두 modifier (이름 그대로)
# ──────────────────────────────────────────────────────────────

# ── 시작 덱 (GDD §3.6, R06 — 12장) ──────────────────────────
# irremovable(생계형 리뷰 표식)은 카드 종이 아니라 "시작 덱 사본"의 속성이다.
# 같은 카드를 런 중 추가 획득한 사본은 제거·판매 가능.
# 표식 8장(접두4+접미4)이 덱 하한(총 10, 접두≥4, 접미≥4)을 자동 보장한다.
starting_deck:
  - { id: P01, irremovable: true }   # 생계형 리뷰 — 제거·판매 불가
  - { id: P05, irremovable: true }
  - { id: P09, irremovable: true }
  - { id: P13, irremovable: true }
  - { id: P02 }
  - { id: S01, irremovable: true }
  - { id: S01, irremovable: true }
  - { id: S03, irremovable: true }
  - { id: S05, irremovable: true }
  - { id: S13 }
  - { id: S14 }
  - { id: X08 }

