<meta charset="utf-8">
<title>이세계 리뷰용사 — 프롤로그</title>
<style>
:root{
  --bg:#12100e; --ink:#efe7d8; --dim:#9a8f7d; --gold:#e0a94b;
  --parch:#e8dcc0; --inkc:#2b2119;
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
     align-items:center;padding:16px;min-height:100vh;font-size:14px}
.screen{width:1344px;height:768px;flex:none;position:relative;overflow:hidden;
        border:1px solid #2a241c;border-radius:6px;background:#070605;cursor:pointer}
.grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.055;
       background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px),
                        repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 4px)}

/* 슬라이드 — 이미지는 아주 느리게 밀어 정지화면처럼 보이지 않게 한다 */
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
/* 충격 슬라이드 — 페이드 없이 즉시 바뀐다. 서서히 밝아지면 터지는 느낌이 죽는다 */
.slide.impact{transition:none}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;
           animation:drift 16s ease-out forwards}
.slide .miss{position:absolute;inset:0;display:grid;place-items:center;
             background:#15120e;color:#4c453b;font-size:13px}
@keyframes drift{from{transform:scale(1.06) translate(1%,.6%)}to{transform:scale(1) translate(0,0)}}
.slide::after{content:"";position:absolute;inset:0;
       background:linear-gradient(transparent 42%,rgba(6,5,4,.82) 78%)}

/* 본문 */
.copy{position:absolute;left:0;right:0;bottom:96px;z-index:4;padding:0 96px;
      opacity:0;transform:translateY(14px);transition:opacity .6s .25s,transform .6s .25s}
.slide.on ~ .copy.cur{opacity:1;transform:translateY(0)}
.copy .no{font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.copy p{font-size:20px;line-height:1.85;max-width:920px;
        text-shadow:0 2px 10px rgba(0,0,0,.9)}
.copy p b{color:#fff;font-weight:700}
/* 대사 — **이름** 으로 시작하는 줄. 화자를 금색으로 떼어내고 본문과 들여쓰기를 분리한다 */
.copy p.say{padding-left:22px;border-left:2px solid rgba(224,169,75,.45);margin-top:4px}
.copy p.say b{color:var(--gold);font-weight:800;margin-right:10px;font-size:16px;
              letter-spacing:-.2px}
.copy p.say + p.say{margin-top:2px}
/* 대사 둘째 줄부터 — 화자 이름 폭만큼 들여써 라인을 맞춘다 */
.copy p.say.cont{padding-left:calc(22px + 4.6em)}
/* 비트가 넘어갈 때 문장이 아래에서 올라온다 */
.beat{animation:beatin .34s ease both}
@keyframes beatin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* 비트 진행 표시 — 슬라이드 점 아래 작은 눈금 */
.beats{position:absolute;left:96px;bottom:44px;z-index:5;display:flex;gap:4px}
.beats i{width:9px;height:2px;border-radius:1px;background:rgba(239,231,216,.2)}
.beats i.on{background:rgba(224,169,75,.85)}

/* 섬광 — 전환 순간 화면 전체가 한 번 하얗게 */
.flash{position:absolute;inset:0;z-index:45;background:#fff;opacity:0;pointer-events:none}


/* 진행 표시 */
.dots{position:absolute;left:96px;bottom:56px;z-index:5;display:flex;gap:7px}
.dots i{width:26px;height:3px;border-radius:2px;background:rgba(239,231,216,.22);
        transition:background .3s}
.dots i.on{background:var(--gold)}
.skip{position:absolute;right:24px;top:20px;z-index:7;padding:7px 15px;font-size:12px;
      color:var(--dim);border:1px solid #4a4238;border-radius:5px;background:rgba(0,0,0,.45)}
.skip:hover{color:var(--ink);border-color:var(--gold)}
.next{position:absolute;right:96px;bottom:52px;z-index:5;font-size:13px;color:var(--dim);
      display:flex;align-items:center;gap:8px}
.next b{color:var(--ink);font-weight:600}
.next .k{border:1px solid #4a4238;border-radius:4px;padding:2px 8px;font-size:11px}

/* 마지막 — 서명 등록으로 */
.gate{position:absolute;inset:0;z-index:8;display:none;place-items:center;
      background:radial-gradient(70% 70% at 50% 45%,rgba(10,8,6,.72),rgba(6,5,4,.95))}
.gate.on{display:grid}
.gate .box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.gate h2{font-size:25px;font-weight:800;letter-spacing:-.5px}
.gate p{color:var(--dim);font-size:14px;line-height:1.8;max-width:560px}
.gate a{padding:13px 30px;border-radius:9px;font-weight:800;text-decoration:none;
        background:linear-gradient(#7a2a1c,#4d1a11);border:1px solid #a4553c;color:var(--ink)}
.gate a:hover{filter:brightness(1.2)}

.note{width:1344px;max-width:100%;margin:14px auto 0;color:#6f675a;font-size:12px;line-height:1.7}
.note b{color:#9a8f7d}
</style>

<div class="screen" id="screen">
  <div id="slides"></div>
  <div class="grain"></div>
  <div class="flash" id="flash"></div>
  <div class="dots" id="dots"></div>
  <div class="beats" id="beats"></div>
  <div class="next"><b>클릭</b> 또는 <span class="k">Space</span> 로 계속</div>
  <div class="skip" id="skip">건너뛰기</div>

  <div class="gate" id="gate">
    <div class="box">
      <h2>이 세계에서 당신을 증명할 방법은 하나뿐입니다</h2>
      <p>만물대장은 당신을 읽지 못합니다.<br>
         이름이 오르지 않으니, 당신이 직접 남기는 기록만이 남습니다.</p>
      <a href="signature.html">서명 남기러 가기 →</a>
    </div>
  </div>
</div>

<p class="note">
  <b>프롤로그</b> — 본문과 이미지 프롬프트의 정본은 <code>design/prologue-v1.md</code> §3이고,
  빌드가 그것을 읽어 이 화면을 만든다. 슬라이드 14장(비트 64) → 서명 등록(S05) → 온보딩 1판(GDD §4.4).
</p>

<script>
const SLIDES = /*{{SLIDES}}*/[];
const wrap = document.getElementById('slides'), dots = document.getElementById('dots');
const beatsEl = document.getElementById('beats');

wrap.innerHTML = SLIDES.map((s, i) => `
  <div class="slide" data-i="${i}">
    ${s.img ? `<img src="${s.img}" alt="">` : `<div class="miss">${s.title} — 이미지 생성 대기</div>`}
  </div>`).join('') + `<div class="copy cur" id="copy"></div>`;
dots.innerHTML = SLIDES.map(() => '<i></i>').join('');

let n = -1, b = 0;

function show(i, beat = 0){
  if (i >= SLIDES.length) { document.getElementById('gate').classList.add('on'); return; }
  const slideChanged = i !== n;
  n = i; b = beat;
  const s = SLIDES[i];

  if (slideChanged){
    document.querySelectorAll('.slide').forEach(el => {
      el.classList.toggle('on', +el.dataset.i === i);
      el.classList.toggle('impact', !!s.impact && +el.dataset.i === i);
    });
    if (s.impact) boom();                           // 대사가 뜨는 그 순간 터진다
    const img = document.querySelector(`.slide[data-i="${i}"] img`);
    if (img) { img.style.animation = 'none'; img.offsetHeight; img.style.animation = ''; }
    document.querySelectorAll('.dots i').forEach((el, j) => el.classList.toggle('on', j <= i));
  }

  // 현재 비트만 보여준다 — 비주얼 노벨 문법
  document.getElementById('copy').innerHTML =
    `<div class="no">${String(i + 1).padStart(2, '0')} · ${s.title}</div>` +
    `<div class="beat">${(() => {
        let insay = false;
        return s.beats[beat].map(l => {
          if (l.startsWith('<b>')) { insay = true; return `<p class="say">${l}</p>`; }
          if (insay) return `<p class="say cont">${l}</p>`;   // 대사 둘째 줄부터
          return `<p>${l}</p>`;
        }).join('');
      })()}</div>`;

  beatsEl.innerHTML = s.beats.map((_, j) =>
    `<i class="${j <= beat ? 'on' : ''}"></i>`).join('');
}

// 클래스 토글은 재시작 타이밍이 브라우저마다 어긋난다. 애니메이션을 직접 구동한다.
function boom(){
  const f = document.getElementById('flash'), scr = document.getElementById('screen');
  f.getAnimations().forEach(a => a.cancel());
  scr.getAnimations().forEach(a => a.cancel());
  f.animate(
    [{opacity:.95},{opacity:.55,offset:.16},{opacity:.18,offset:.42},{opacity:0}],
    {duration:520, easing:'ease-out'});
  scr.animate([
    {transform:'translate(0,0)'},   {transform:'translate(-10px,6px)',offset:.12},
    {transform:'translate(9px,-7px)',offset:.28}, {transform:'translate(-6px,-3px)',offset:.48},
    {transform:'translate(5px,4px)',offset:.68},  {transform:'translate(-3px,2px)',offset:.85},
    {transform:'translate(0,0)'}],
    {duration:440, easing:'cubic-bezier(.36,.07,.19,.97)'});
}

function advance(){
  const s = SLIDES[n];
  if (s && b + 1 < s.beats.length) show(n, b + 1);
  else show(n + 1, 0);
}
function back(){
  if (b > 0) show(n, b - 1);
  else if (n > 0) show(n - 1, SLIDES[n - 1].beats.length - 1);
}

document.getElementById('screen').addEventListener('click', e => {
  if (e.target.closest('.skip') || e.target.closest('.gate')) return;
  advance();
});
document.getElementById('skip').addEventListener('click', e => {
  e.stopPropagation();
  show(SLIDES.length);
});
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight'){ e.preventDefault(); advance(); }
  if (e.code === 'ArrowLeft'){ e.preventDefault(); back(); }
});
show(0, 0);
</script>
