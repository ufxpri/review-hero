<meta charset="utf-8">
<title>이세계 리뷰용사 — 프롤로그</title>
<style>
:root{
  --bg:#12100e; --ink:#efe7d8; --dim:#9a8f7d; --gold:#e0a94b;
  --parch:#e8dcc0; --inkc:#2b2119;
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
     align-items:center;padding:16px;min-height:100vh;font-size:14px}
.screen{width:1344px;height:768px;flex:none;position:relative;overflow:hidden;
        border:1px solid #2a241c;border-radius:6px;background:#070605;cursor:pointer}
.grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.055;
       background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px),
                        repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 4px)}

/* 슬라이드 — 이미지는 아주 느리게 밀어 정지화면처럼 보이지 않게 한다 */
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
/* 충격 슬라이드 — 페이드 없이 즉시 바뀐다. 서서히 밝아지면 터지는 느낌이 죽는다 */
.slide.impact{transition:none}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;
           animation:drift 16s ease-out forwards}
.slide .miss{position:absolute;inset:0;display:grid;place-items:start center;
             padding-top:9vh;background:#15120e;color:#3a352d;font-size:12px;
             letter-spacing:2px}   /* 본문·등록부와 겹치지 않게 위쪽에 둔다 */
@keyframes drift{from{transform:scale(1.06) translate(1%,.6%)}to{transform:scale(1) translate(0,0)}}
.slide::after{content:"";position:absolute;inset:0;
       background:linear-gradient(transparent 42%,rgba(6,5,4,.82) 78%)}

/* 본문 */
.copy{position:absolute;left:0;right:0;bottom:96px;z-index:4;padding:0 96px;
      opacity:0;transform:translateY(14px);transition:opacity .6s .25s,transform .6s .25s}
.slide.on ~ .copy.cur{opacity:1;transform:translateY(0)}
.copy .no{font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.copy p{font-size:20px;line-height:1.85;max-width:920px;
        text-shadow:0 2px 10px rgba(0,0,0,.9)}
.copy p b{color:#fff;font-weight:700}
/* 대사 — **이름** 으로 시작하는 줄. 화자를 금색으로 떼어내고 본문과 들여쓰기를 분리한다 */
.copy p.say{padding-left:22px;border-left:2px solid rgba(224,169,75,.45);margin-top:4px}
.copy p.say b{color:var(--gold);font-weight:800;margin-right:10px;font-size:16px;
              letter-spacing:-.2px}
.copy p.say + p.say{margin-top:2px}
/* 대사 둘째 줄부터 — 화자 이름 폭만큼 들여써 라인을 맞춘다 */
.copy p.say.cont{padding-left:calc(22px + 4.6em)}
/* 비트가 넘어갈 때 문장이 아래에서 올라온다 */
.beat{animation:beatin .34s ease both}

/* ══ 리뷰어 등록 계약서 — A4 세로, 화면 중앙 ══════════════════ */
#sheet{position:absolute;inset:0;z-index:46;display:none;place-items:center;
       background:rgba(8,6,4,.74);backdrop-filter:blur(3px)}
#sheet.on{display:grid}
#sheet .paper{position:relative;height:86vh;aspect-ratio:210/297;max-width:94vw;
       background:#e9ddc2;color:#2b2119;border-radius:3px;
       box-shadow:0 30px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.5);
       background-image:repeating-linear-gradient(91deg,rgba(120,100,60,.045) 0 2px,transparent 2px 6px);
       padding:5.4% 7%;display:flex;flex-direction:column;
       animation:paperin .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes paperin{from{opacity:0;transform:translateY(26px) rotate(-.6deg) scale(.985)}
                   to{opacity:1;transform:none}}
#sheet .paper::after{content:"";position:absolute;inset:2.6% 3.2%;border:1px solid #c8b48c;
       pointer-events:none}
#sheet h2{font-size:19px;font-weight:800;letter-spacing:6px;text-align:center}
#sheet .sub{margin-top:7px;text-align:center;font-size:11px;letter-spacing:3px;color:#8a7a5c}
#sheet .sep{margin:16px 0 4px;height:1px;background:#c8b48c}
#sheet ol{margin:14px 0 0;padding:0;list-style:none;font-size:12.5px;line-height:2;color:#4a3f31}
#sheet ol li{position:relative;padding-left:26px;margin-bottom:6px;text-indent:0}
#sheet ol li b{position:absolute;left:0;top:0;color:#7a2a1c;font-weight:800}
#sheet .fields{margin-top:auto}
#sheet .fld{margin-top:20px}
#sheet .cap{font-size:10px;letter-spacing:4px;color:#8a7a5c;margin-bottom:5px}
#sheet input{width:100%;background:transparent;border:0;border-bottom:1px solid #a89572;
       color:#2b2119;font:inherit;font-size:26px;font-weight:700;padding:2px 2px 9px;outline:none}
#sheet input::placeholder{color:rgba(43,33,25,.24);font-weight:400;font-size:17px}
#sheet input:focus{border-bottom-color:#7a2a1c}
#sheet .pad{position:relative;width:100%;aspect-ratio:660/220;border-bottom:1px solid #a89572;
       cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'><path d='M26 3C16 6 8 13 5 23l3 3C18 23 25 15 26 3z' fill='%23e8dcc0' stroke='%232b2119'/><path d='M5 26l-3 3' stroke='%232b2119' stroke-width='2'/></svg>") 2 28,crosshair;
       touch-action:none;overflow:hidden}
#sheet .pad svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#sheet .pad path{fill:none;stroke:#2b2119;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
#sheet .sigph{position:absolute;left:2px;bottom:9px;font-size:12px;color:#a89572;
       pointer-events:none;transition:opacity .2s}
#sheet .pad.dirty .sigph{opacity:0}
#sheet .foot{display:flex;align-items:center;gap:10px;margin-top:16px}
#sheet .note2{flex:1;font-size:10.5px;line-height:1.6;color:#8a7a5c;text-align:right;padding-right:4px}
#sheet button{font:inherit;cursor:pointer;border-radius:4px}
#sheet .undo{background:none;border:1px solid #c8b48c;color:#6b5c44;font-size:10.5px;padding:6px 10px}
#sheet .undo:hover{border-color:#7a2a1c;color:#7a2a1c}
#sheet .ok{border:1px solid #5c1f14;background:linear-gradient(#8a3020,#5c1f14);color:#f0e2c6;
       font-weight:800;font-size:13px;letter-spacing:2px;padding:11px 26px}
#sheet .ok:hover{filter:brightness(1.15)}
#sheet .paper.warn{animation:regshake .34s}
@keyframes regshake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}
                    75%{transform:translateX(-3px)}}
@keyframes beatin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* 비트 진행 표시 — 슬라이드 점 아래 작은 눈금 */
.beats{position:absolute;left:96px;bottom:44px;z-index:5;display:flex;gap:4px}
.beats i{width:9px;height:2px;border-radius:1px;background:rgba(239,231,216,.2)}
.beats i.on{background:rgba(224,169,75,.85)}

/* 섬광 — 전환 순간 화면 전체가 한 번 하얗게 */
.flash{position:absolute;inset:0;z-index:45;background:#fff;opacity:0;pointer-events:none}


/* 진행 표시 */
.dots{position:absolute;left:96px;bottom:56px;z-index:5;display:flex;gap:7px}
.dots i{width:26px;height:3px;border-radius:2px;background:rgba(239,231,216,.22);
        transition:background .3s}
.dots i.on{background:var(--gold)}
.skip{position:absolute;right:24px;top:20px;z-index:7;padding:7px 15px;font-size:12px;
      color:var(--dim);border:1px solid #4a4238;border-radius:5px;background:rgba(0,0,0,.45)}
.skip:hover{color:var(--ink);border-color:var(--gold)}
.next{position:absolute;right:96px;bottom:52px;z-index:5;font-size:13px;color:var(--dim);
      display:flex;align-items:center;gap:8px}
.next b{color:var(--ink);font-weight:600}
.next .k{border:1px solid #4a4238;border-radius:4px;padding:2px 8px;font-size:11px}

/* 마지막 — 서명 등록으로 */
.gate{position:absolute;inset:0;z-index:8;display:none;place-items:center;
      background:radial-gradient(70% 70% at 50% 45%,rgba(10,8,6,.72),rgba(6,5,4,.95))}
.gate.on{display:grid}
.gate .box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.gate h2{font-size:25px;font-weight:800;letter-spacing:-.5px}
.gate p{color:var(--dim);font-size:14px;line-height:1.8;max-width:560px}
.gate a{padding:13px 30px;border-radius:9px;font-weight:800;text-decoration:none;
        background:linear-gradient(#7a2a1c,#4d1a11);border:1px solid #a4553c;color:var(--ink)}
.gate a:hover{filter:brightness(1.2)}

.note{width:1344px;max-width:100%;margin:14px auto 0;color:#6f675a;font-size:12px;line-height:1.7}
.note b{color:#9a8f7d}
</style>

<div class="screen" id="screen">
  <div id="slides"></div>
  <div class="grain"></div>
  <div class="flash" id="flash"></div>
  <div class="dots" id="dots"></div>
  <div class="beats" id="beats"></div>
  <div class="next"><b>클릭</b> 또는 <span class="k">Space</span> 로 계속</div>
  <div class="skip" id="skip">건너뛰기</div>

  <div class="gate" id="gate">
    <div class="box">
      <h2>이 세계에서 당신을 증명할 방법은 하나뿐입니다</h2>
      <p>만물대장은 당신을 읽지 못합니다.<br>
         이름이 오르지 않으니, 당신이 직접 남기는 기록만이 남습니다.</p>
      <a href="signature.html">서명 남기러 가기 →</a>
    </div>
  </div>
</div>

<p class="note">
  <b>프롤로그</b> — 본문과 이미지 프롬프트의 정본은 <code>design/prologue-v1.md</code> §3이고,
  빌드가 그것을 읽어 이 화면을 만든다. 마지막 슬라이드 P15에서 이름과 서명을 한 장에 받아 <code>reviewhero.penname</code>·<code>reviewhero.sig</code>로 저장하고, 온보딩 1판(GDD §4.4)으로 넘어간다.
</p>

<script>
const SLIDES = /*{{SLIDES}}*/[];
const wrap = document.getElementById('slides'), dots = document.getElementById('dots');
const beatsEl = document.getElementById('beats');

wrap.innerHTML = SLIDES.map((s, i) => `
  <div class="slide" data-i="${i}">
    ${s.img ? `<img src="${s.img}" alt="">` : `<div class="miss">${s.title} — 이미지 생성 대기</div>`}
  </div>`).join('') + `<div class="copy cur" id="copy"></div><div id="sheet"></div>`;
dots.innerHTML = SLIDES.map(() => '<i></i>').join('');

let n = -1, b = 0;

function show(i, beat = 0){
  if (i >= SLIDES.length) { document.getElementById('gate').classList.add('on'); return; }
  const slideChanged = i !== n;
  n = i; b = beat;
  const s = SLIDES[i];

  if (slideChanged){
    document.querySelectorAll('.slide').forEach(el => {
      el.classList.toggle('on', +el.dataset.i === i);
      el.classList.toggle('impact', !!s.impact && +el.dataset.i === i);
    });
    if (s.impact) boom();                           // 대사가 뜨는 그 순간 터진다
    const img = document.querySelector(`.slide[data-i="${i}"] img`);
    if (img) { img.style.animation = 'none'; img.offsetHeight; img.style.animation = ''; }
    document.querySelectorAll('.dots i').forEach((el, j) => el.classList.toggle('on', j <= i));
  }

  // 현재 비트만 보여준다 — 비주얼 노벨 문법
  let wantSheet = false;
  document.getElementById('copy').innerHTML =
    `<div class="no">${String(i + 1).padStart(2, '0')} · ${s.title}</div>` +
    `<div class="beat">${(() => {
        let insay = false;
        return s.beats[beat].map(l => {
          const inp = l.match(/^\[PLAYER_INPUT:\s*(.+?)\]$/);
          if (inp) { wantSheet = true; return ''; }        // 계약서는 별도 레이어에 띄운다
          if (l.startsWith('<b>')) { insay = true; return `<p class="say">${l}</p>`; }
          if (insay) return `<p class="say cont">${l}</p>`;   // 대사 둘째 줄부터
          return `<p>${l}</p>`;
        }).join('');
      })()}</div>`;

  const sheet = document.getElementById('sheet');
  sheet.classList.toggle('on', wantSheet);
  sheet.innerHTML = wantSheet ? SHEET_HTML() : '';
  if (wantSheet) {
    const pen = document.getElementById('penname');
    pen.focus();
    pen.addEventListener('input', () => { PEN = pen.value.trim(); });
    pen.addEventListener('keydown', e => { if (e.code === 'Enter') document.getElementById('sigpad').scrollIntoView({block:'nearest'}); });
    bindSig();
    document.getElementById('regok').onclick = e => { e.stopPropagation(); advance(); };
  }

  beatsEl.innerHTML = s.beats.map((_, j) =>
    `<i class="${j <= beat ? 'on' : ''}"></i>`).join('');
}

// 클래스 토글은 재시작 타이밍이 브라우저마다 어긋난다. 애니메이션을 직접 구동한다.
function boom(){
  const f = document.getElementById('flash'), scr = document.getElementById('screen');
  f.getAnimations().forEach(a => a.cancel());
  scr.getAnimations().forEach(a => a.cancel());
  f.animate(
    [{opacity:.95},{opacity:.55,offset:.16},{opacity:.18,offset:.42},{opacity:0}],
    {duration:520, easing:'ease-out'});
  scr.animate([
    {transform:'translate(0,0)'},   {transform:'translate(-10px,6px)',offset:.12},
    {transform:'translate(9px,-7px)',offset:.28}, {transform:'translate(-6px,-3px)',offset:.48},
    {transform:'translate(5px,4px)',offset:.68},  {transform:'translate(-3px,2px)',offset:.85},
    {transform:'translate(0,0)'}],
    {duration:440, easing:'cubic-bezier(.36,.07,.19,.97)'});
}

let PEN = localStorage.getItem('reviewhero.penname') || '';

// 만물대장 리뷰어 등록 계약서 — 조항은 worldview §1.1 원칙에서 나온다
function SHEET_HTML(){
  return `<div class="paper" id="paper">
    <h2>만 물 대 장 · 리 뷰 어 등 록</h2>
    <div class="sub">등 록 하 는 순 간 부 터 효 력 이 발 생 한 다</div>
    <div class="sep"></div>
    <ol>
      <li><b>一</b>올린 글은 지워지지 않는다. 틀린 것도, 작정하고 쓴 것도 그대로 남는다.</li>
      <li><b>二</b>글의 힘은 그 글이 받은 좋아요가 정한다. 아무도 누르지 않은 글은 올라가 있어도 아무것도 깎지 못한다.</li>
      <li><b>三</b>서명하지 않은 글은 올라가지 않는다. 올리는 것이 곧 서명하는 것이다.</li>
      <li><b>四</b>여기 적는 이름은 사람들이 본다. 서명은 대장이 대조한다.</li>
    </ol>
    <div class="fields">
      <div class="fld">
        <div class="cap">작 성 자 명</div>
        <input id="penname" maxlength="12" autocomplete="off" spellcheck="false"
               placeholder="저쪽 세계에서 쓰던 이름" value="\${PEN.replace(/"/g,'&quot;')}">
      </div>
      <div class="fld">
        <div class="cap">서 명</div>
        <div class="pad" id="sigpad">
          <svg id="sigink" viewBox="0 0 660 220" preserveAspectRatio="none"></svg>
          <div class="sigph">여기에 서명하세요</div>
        </div>
      </div>
      <div class="foot">
        <button class="undo" id="sigundo" type="button">한 획 지우기</button>
        <button class="undo" id="sigclear" type="button">다시 쓰기</button>
        <div class="note2">이름과 서명은 되돌릴 수 없다.</div>
        <button class="ok" id="regok" type="button">등 록</button>
      </div>
    </div>
  </div>`;
}
// 서명 — ui/signature.html 과 같은 660×236 좌표계, 같은 저장 스키마
let SIG = (() => { try { return JSON.parse(localStorage.getItem('reviewhero.sig'))?.strokes || []; }
                   catch { return []; } })();

function sigPath(pts){                      // 중점 이차 베지어로 손떨림을 눌러준다
  if (pts.length < 2) return `M${pts[0][0]},${pts[0][1]} l0.1,0`;
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++){
    const [x, y] = pts[i], [nx, ny] = pts[i + 1];
    d += ` Q${x},${y} ${((x + nx) / 2).toFixed(1)},${((y + ny) / 2).toFixed(1)}`;
  }
  const l = pts[pts.length - 1];
  return d + ` L${l[0]},${l[1]}`;
}

function bindSig(){
  const pad = document.getElementById('sigpad'), ink = document.getElementById('sigink');
  let cur = null, drawing = false;
  const pt = e => { const r = pad.getBoundingClientRect();
    return [ +((e.clientX - r.left) / r.width  * 660).toFixed(1),
             +((e.clientY - r.top ) / r.height * 220).toFixed(1) ]; };
  const draw = () => {
    ink.innerHTML = SIG.map(st => `<path d="${sigPath(st)}"/>`).join('');
    pad.classList.toggle('dirty', SIG.length > 0);
  };
  pad.addEventListener('pointerdown', e => {
    e.stopPropagation();                    // 슬라이드 넘김으로 새지 않게
    drawing = true; cur = [pt(e)]; SIG.push(cur);
    pad.setPointerCapture(e.pointerId); draw();
  });
  pad.addEventListener('pointermove', e => {
    if (!drawing) return;
    const q = pt(e), last = cur[cur.length - 1];
    if (Math.hypot(q[0] - last[0], q[1] - last[1]) < 2.5) return;
    cur.push(q); draw();
  });
  addEventListener('pointerup', () => { drawing = false; cur = null; });
  document.getElementById('sigundo').onclick  = e => { e.stopPropagation(); SIG.pop(); draw(); };
  document.getElementById('sigclear').onclick = e => { e.stopPropagation(); SIG.length = 0; draw(); };
  draw();
}

function advance(){
  const pen = document.getElementById('penname');
  if (pen) {                                   // 이름과 서명이 둘 다 있어야 넘어간다
    PEN = pen.value.trim();
    if (!PEN || !SIG.length) {
      const box = document.getElementById('paper');
      box.classList.remove('warn'); box.offsetHeight; box.classList.add('warn');
      if (!PEN) pen.focus();
      return;
    }
    localStorage.setItem('reviewhero.penname', PEN);
    localStorage.setItem('reviewhero.sig', JSON.stringify({v:1, box:[660,220], strokes:SIG}));
  }
  const s = SLIDES[n];
  if (s && b + 1 < s.beats.length) show(n, b + 1);
  else show(n + 1, 0);
}
function back(){
  if (b > 0) show(n, b - 1);
  else if (n > 0) show(n - 1, SLIDES[n - 1].beats.length - 1);
}

document.getElementById('screen').addEventListener('click', e => {
  if (e.target.closest('.skip') || e.target.closest('.gate') || e.target.closest('#sheet')) return;
  advance();
});
document.getElementById('skip').addEventListener('click', e => {
  e.stopPropagation();
  show(SLIDES.length);
});
addEventListener('keydown', e => {
  const typing = e.target instanceof HTMLInputElement;
  // 입력 중에는 스페이스가 글자다. 엔터만 제출로 받는다.
  if (typing && e.code !== 'Enter') return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight'){ e.preventDefault(); advance(); }
  if (e.code === 'ArrowLeft'){ e.preventDefault(); back(); }
});
show(0, 0);
</script>
