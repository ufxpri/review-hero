<meta charset="utf-8">
<title>이세계 리뷰용사 — 전투</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ── 전투 화면 — ui/combat.template.html 의 끌어다 놓기 UX 를 실제 엔진(RHEngine.Battle)에 이식.
     조작: 손패 카드를 상품(판매자 / 그 판매자의 구성품 / 내가 산 상품) 위로 끌어다 놓는다.
           만물마켓에선 무엇이든 상품이다 — 고블린도 상품이고 고블린이 든 칼도 별개 상품이다.
           끌 수 없는 환경·자동 검증을 위해 「카드 클릭 → 대상 클릭」 폴백도 함께 산다. ── */
.wrap{width:1344px;margin:6px auto 0}
.screen{width:1344px;height:768px;position:relative;overflow:hidden;
        border:1px solid #2a241c;border-radius:6px;
        background:#0d0b09 url('../assets/scene.png') center/cover no-repeat}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
        background:radial-gradient(120% 92% at 58% 40%,transparent 36%,rgba(0,0,0,.78))}
.grain{position:absolute;inset:0;pointer-events:none;z-index:41;opacity:.05;
       background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px),
                        repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 4px)}
/* 앰비언트 파티클 — 무대 뒤(z-index 9). 배경 위, 인물·UI 아래 */
#pfx{position:absolute;inset:0;z-index:9;pointer-events:none;width:100%;height:100%}
/* 무대 — 아래 272px 은 손패 몫 */
.stage{position:absolute;inset:0 0 272px 0;z-index:10}

/* 적 인텐트 */
.intent{position:absolute;left:656px;top:6px;width:372px;z-index:13;
        background:var(--panel);border:1px solid var(--edge-hi);border-radius:5px;
        padding:5px 11px;display:flex;align-items:center;gap:9px;transition:box-shadow .2s}
.intent.act{box-shadow:0 0 0 2px var(--red),0 0 26px rgba(194,69,46,.5)}
.intent .ico{font-size:17px}
.intent .lab{font-size:11px;color:var(--dim);letter-spacing:.3px}
.intent .val{font-weight:700}
.intent .num{margin-left:auto;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;
             white-space:nowrap;font-size:12px}

/* 이름표 = 상품 스펙. 적 바로 위 */
.eplate{position:absolute;left:656px;top:50px;width:372px;z-index:13;
        background:var(--panel);border:1px solid var(--edge);border-radius:6px;
        padding:8px 11px;display:flex;flex-direction:column;gap:5px;align-items:center}
.ename{font-weight:800;font-size:17px;letter-spacing:-.3px}
.ename .tiny{font-weight:400;margin-left:4px}
.rating{display:flex;align-items:center;gap:7px;font-size:11.5px}
.rating .st{color:var(--gold);letter-spacing:1px;font-size:14px}
.rating .n{color:var(--dim);font-variant-numeric:tabular-nums}
.egauge{width:100%;height:17px;border:1px solid var(--edge);border-radius:3px;
       overflow:hidden;background:rgba(0,0,0,.55);position:relative}
.egauge i{display:block;height:100%;background:linear-gradient(#c2452e,#8e2f1f);
          transition:width .45s cubic-bezier(.2,.8,.3,1)}
.egauge span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;
            font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.ghostbar{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,.42);
          transition:width .75s ease-out .18s}
.nulls{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.null{font-size:10.5px;border:1px solid #7a3a2c;color:#e08b72;border-radius:3px;
      padding:1px 6px;background:rgba(122,58,44,.18)}
.weak{font-size:10.5px;border:1px solid #3c6b49;color:#8fce9e;border-radius:3px;
      padding:1px 6px;background:rgba(79,154,94,.14)}
.emods{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.emods .m{font-size:10px;border:1px solid var(--edge);border-radius:3px;padding:1px 6px;
          background:rgba(0,0,0,.35);color:var(--ink)}
.emods .m.bad{border-color:#7a3a2c;color:#e08b72}
.emods .m.good{border-color:#3c6b49;color:#8fce9e}

/* 판매자 상품 — 드롭 존 */
.enemybox{position:absolute;left:700px;top:170px;width:288px;height:290px;z-index:11;
          cursor:pointer;border-radius:12px}
.ebody{width:100%;height:100%;display:grid;place-items:center;font-size:168px;line-height:1;
       filter:drop-shadow(0 18px 34px rgba(0,0,0,.85))}
/* 적 아트는 배경을 걷어낸 투명 PNG(ui/assets/_orig 에 원본)라 마스크로 깎지 않는다 */
.ebody img{width:100%;height:100%;object-fit:contain;object-position:bottom center}
.stealthnote{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:12;
       background:rgba(9,8,7,.85);border:1px dashed var(--edge-hi);border-radius:6px;
       padding:6px 12px;font-size:12px;white-space:nowrap;display:none}
.stealth .stealthnote{display:block}
.stealth .ebody{opacity:.28;filter:blur(2px) drop-shadow(0 18px 34px rgba(0,0,0,.85))}

/* 적 구성품 — 적 좌우에 연결선으로 떠 있는 카드 */
.gearcol{position:absolute;top:222px;width:170px;z-index:13;
         display:flex;flex-direction:column;gap:8px}
.gearcol.l{left:468px}
.gearcol.r{left:1050px}
.gearcol .hd{font-size:10px;color:var(--dim);text-align:center;letter-spacing:.3px}
.slot{border:1px solid var(--edge);border-radius:6px;padding:6px 8px;cursor:pointer;
      background:linear-gradient(rgba(232,220,192,.1),rgba(232,220,192,.03)),var(--slab);
      display:flex;flex-direction:column;gap:4px;position:relative}
.slot.dead{opacity:.4;cursor:default}
.slot .nm{font-size:12px;font-weight:700;line-height:1.25}
.slot .tg{display:flex;gap:3px;flex-wrap:wrap}
.slot .tg b{font-size:9px;font-weight:600;background:#2f2a20;color:#e8d9ae;
            border-radius:3px;padding:1px 5px}
.slot .du{font-size:10px;color:var(--dim)}
.dur{height:6px;border:1px solid var(--edge);border-radius:2px;background:rgba(0,0,0,.5)}
.dur i{display:block;height:100%;background:#8a7a4e;transition:width .3s}
/* 연결선 — 이 구성품이 저 상품 것임을 눈으로 잇는다 */
.gearcol.l .slot::after{content:"";position:absolute;top:50%;width:58px;height:1px;
      background:linear-gradient(90deg,var(--edge),rgba(107,86,54,.2));right:-59px}
.gearcol.r .slot::after{content:"";position:absolute;top:50%;width:58px;height:1px;
      background:linear-gradient(270deg,var(--edge),rgba(107,86,54,.2));left:-59px}

/* 주인공 — 좌측 전경 */
.hero{position:absolute;left:0;top:122px;width:280px;height:350px;z-index:14;border-radius:12px}
.hero img{width:100%;height:100%;object-fit:contain;object-position:bottom left;
          filter:drop-shadow(0 16px 30px rgba(0,0,0,.9)) drop-shadow(0 0 22px rgba(224,169,75,.14))}

/* 내 장비 — 주인공 오른쪽 */
.mygear{position:absolute;left:264px;top:200px;width:182px;z-index:13;
        display:flex;flex-direction:column;gap:6px}
.mygear .hd{font-size:10px;color:var(--dim);letter-spacing:.3px}
.mygear .at{font-size:10px;color:#8fce9e}
/* 남은 방어 — 찬양 리뷰가 쌓고 적 좋아요가 깎는다 (ADR-023 ①) */
.slot .def{font-size:10.5px;color:#7fc4e8;margin-top:2px}
.slot .def b{font-size:12px;color:#a9dcf7}
.slot .def .dn{color:#6a8ea3;font-size:9.5px}
.cbtn.parcel{border-color:#b98b3e;color:#f0d69a}

/* 초고 폐기함 — 카드를 여기에 끌어다 놓으면 퇴고(1장 버리고 1장 드로우) */
.trash{position:absolute;left:268px;bottom:6px;width:178px;z-index:13;cursor:pointer;
       border:1px dashed var(--edge);border-radius:8px;padding:7px 9px;
       background:rgba(9,8,7,.62);display:flex;align-items:center;gap:9px}
.trash .ti{font-size:22px;line-height:1}
.trash b{font-size:12px;display:block}
.trash .tn{font-size:9.5px;color:var(--dim);line-height:1.3;margin-top:2px}

/* ── 드롭 존 공통 — 끄는 동안에만 드러난다 ─────────────── */
.drop{transition:box-shadow .12s,transform .12s}
.dragging .drop{outline:2px dashed rgba(224,169,75,.55);outline-offset:3px;border-radius:8px}
.dragging .drop.nomatch{outline-color:rgba(150,80,62,.4);opacity:.5}
.dragging .drop.nomatch::before{content:"대상 아님";position:absolute;left:50%;top:50%;z-index:22;
      transform:translate(-50%,-50%);background:rgba(9,8,7,.92);border:1px solid #7a3a2c;
      color:#e08b72;border-radius:4px;padding:2px 8px;font-size:10.5px;white-space:nowrap;
      pointer-events:none;font-weight:700}
.drop.hot{box-shadow:0 0 0 2px var(--gold),0 0 34px rgba(224,169,75,.45);
          transform:translateY(-2px);border-radius:8px}
.drop.nope{animation:nope .32s ease-in-out}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}
  50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
/* 끄는 동안엔 커서가 깃펜이 된다 */
.dragging,.dragging *{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'><path d='M26 3C16 6 8 13 5 23l3 3C18 23 25 15 26 3z' fill='%23e8dcc0' stroke='%232b2119'/><path d='M5 26l-3 3' stroke='%232b2119' stroke-width='2'/></svg>") 2 28,crosshair}

/* ── 판정 말풍선 — 드롭 존 위에 올렸을 때 그 대상 기준으로 뜬다 ── */
.verdict{position:absolute;z-index:33;display:none;width:376px;
         background:var(--parch);color:var(--inkc);border:2px solid var(--inkc);
         border-radius:12px;padding:9px 13px;box-shadow:5px 5px 0 rgba(0,0,0,.55);
         pointer-events:none}
.verdict.show{display:block}
.verdict::after{content:"";position:absolute;left:34px;bottom:-15px;
         border:8px solid transparent;border-top:15px solid var(--inkc)}
.verdict::before{content:"";position:absolute;left:36px;bottom:-11px;z-index:1;
         border:6px solid transparent;border-top:12px solid var(--parch)}
.verdict .vb{font-weight:900;font-size:15px;letter-spacing:-.3px}
.verdict .vnote{font-size:11.5px;color:#4a4136;margin-top:3px;line-height:1.45}
.verdict .vnum{font-weight:800;font-size:13px;margin-top:5px;font-variant-numeric:tabular-nums}
.v-origin .vb{color:#9a6b12} .v-fact .vb{color:#2f6b3c}
.v-normal .vb,.v-none .vb{color:#5c5344} .v-fumble .vb,.v-bad .vb{color:#a3301c}
.v-miss .vb,.v-void .vb{color:#7b6a4d}
.verdict .burstfx{position:absolute;inset:-28px;z-index:-1;border-radius:50%;opacity:.4;display:none;
     background:repeating-conic-gradient(from 0deg,rgba(224,169,75,.55) 0 3deg,transparent 3deg 9deg)}

/* ── 하단 — 상태창 / 손패 / 조작 ─────────────────── */
.hand{position:absolute;left:0;right:0;bottom:0;height:272px;z-index:15;
      background:linear-gradient(transparent,rgba(6,5,4,.94) 26%)}

/* 안내 줄 — 조작법과 현재 모드 */
.hintbar{position:absolute;left:218px;right:208px;top:0;height:24px;z-index:18;
         display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px;
         color:var(--dim);background:var(--slab);border:1px solid var(--edge);
         border-radius:5px;white-space:nowrap;overflow:hidden}
.hintbar b{color:var(--ink)}
.hintbar .bo{color:var(--gold)} .hintbar .bf{color:#8fce9e} .hintbar .bx{color:#e08b72}
.hintbar .sp{margin-left:auto}
.hintbar button{font:inherit;cursor:pointer;color:var(--ink);border-radius:4px;
      background:linear-gradient(#3a2f1e,#2a2115);border:1px solid var(--edge);padding:1px 8px}

/* 좌: 내 상태창 (드롭 존 — 찬양 리뷰를 여기에 붙인다) */
.pstatus{position:absolute;left:10px;bottom:12px;width:200px;z-index:17;
         background:var(--slab);border:2px solid var(--edge);border-radius:8px;
         box-shadow:inset 0 0 0 1px rgba(232,220,192,.12);padding:9px 10px;
         display:flex;flex-direction:column;gap:6px}
.pstatus .who{font-size:10.5px;color:var(--dim);letter-spacing:.3px;line-height:1.35}
.pwill{display:flex;align-items:center;gap:6px}
.pwill .lb{font-size:11.5px;white-space:nowrap}
.pbar{flex:1;height:16px;border:1px solid var(--edge);border-radius:3px;overflow:hidden;
      background:rgba(0,0,0,.55);position:relative}
.pbar i{display:block;height:100%;background:linear-gradient(#4f9a5e,#2f6b3c);
        transition:width .45s cubic-bezier(.2,.8,.3,1)}
.pbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;
           font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.trustrow{display:flex;align-items:center;gap:6px}
.trustrow .lb{font-size:10.5px;color:var(--dim);white-space:nowrap}
.trust{display:flex;gap:2px;flex:1}
.trust i{flex:1;height:10px;border:1px solid var(--edge);border-radius:2px;
         background:rgba(0,0,0,.5)}
.trust i.on{background:var(--gold);border-color:var(--gold);
            box-shadow:0 0 5px rgba(224,169,75,.5)}
.trust i.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5);
  box-shadow:0 0 14px var(--gold)}100%{transform:scale(1)}}
.critnote{font-size:10.5px;color:var(--dim);line-height:1.35}
.critnote.hot{color:var(--gold);font-weight:700}
.pmisc{font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.4}
.ppile{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}

/* 우: 조작 */
.ctrl{position:absolute;right:10px;bottom:12px;width:190px;z-index:17;
      display:flex;flex-direction:column;align-items:center;gap:8px}
.orb{width:72px;height:72px;border-radius:50%;border:2px solid var(--edge-hi);
     background:radial-gradient(#3a2f1c,#141009);display:grid;place-items:center;
     box-shadow:0 0 26px rgba(224,169,75,.25);text-align:center}
.orb b{font-size:23px;font-weight:800;color:var(--gold);line-height:1}
.orb em{font-style:normal;font-size:10px;color:var(--dim)}
.ctrlbtns{width:100%;display:flex;flex-direction:column;gap:5px}
.cbtn{width:100%;padding:7px 0;text-align:center;font-size:11.5px;font-weight:700;
      cursor:pointer;letter-spacing:.3px;border-radius:6px;color:var(--ink);
      background:linear-gradient(#3a2f1e,#2a2115);border:1px solid var(--edge)}
.cbtn:hover{filter:brightness(1.18)}
.cbtn:disabled{opacity:.4;cursor:default;filter:none}
.cbtn.end{padding:11px 0;font-size:13px;font-weight:800;
          background:linear-gradient(#7a2a1c,#4d1a11);border:1px solid #a4553c}
.cbtn.crit{background:linear-gradient(#6b4f1e,#4a3612);border-color:var(--gold);
           color:#ffe9bd;animation:critglow 1.2s ease-in-out infinite}
@keyframes critglow{0%,100%{box-shadow:0 0 6px rgba(224,169,75,.3)}
  50%{box-shadow:0 0 18px rgba(224,169,75,.75)}}
.cbtn.warn{border-color:#a4553c;color:#f0b0a0}

/* ── 손패 — 큰 양피지 카드. 겹치지 않고 본문이 전부 읽힌다 ──
   카드 1장 = 완성 리뷰(ADR-011). 본문이 이 게임의 얼굴이라 가독성이 최우선이다. */
/* 카드는 안내 줄(z 18)보다 앞 — 들어 올려질 때 가려지지 않는다 */
.cards{position:absolute;left:218px;right:208px;bottom:8px;height:240px;z-index:19;
       display:flex;align-items:flex-end;justify-content:center;gap:10px}
.card{width:175px;height:240px;background:var(--parch);color:var(--inkc);
      border:1px solid var(--parch-d);border-radius:9px;padding:8px 9px;cursor:grab;
      display:flex;flex-direction:column;transition:transform .13s,box-shadow .13s;
      box-shadow:0 8px 22px rgba(0,0,0,.6);position:relative;flex:none;
      background-image:repeating-linear-gradient(92deg,rgba(120,100,60,.05) 0 2px,transparent 2px 5px)}
.card:hover{transform:translateY(-14px) scale(1.04);z-index:5;
      box-shadow:0 20px 42px rgba(0,0,0,.8)}
.card.sel{outline:2px solid var(--gold);transform:translateY(-18px) scale(1.05);z-index:6}
.card.ghost{opacity:.34}
.card.special{border-top:4px solid #a3301c}
.chead{display:flex;align-items:center;gap:5px;min-height:15px}
.cstars{color:#9a6b12;font-size:11px;letter-spacing:1px}
.jb{font-weight:800;font-size:9px;border-radius:3px;padding:1px 5px;margin-left:auto;
    border:1px solid;white-space:nowrap}
.jb-origin{color:#9a6b12;border-color:#c9a227;background:rgba(224,169,75,.3)}
.jb-fact{color:#2f6b3c;border-color:#3c6b49;background:rgba(79,154,94,.18)}
.jb-fumble{color:#a3301c;border-color:#a3553c;background:rgba(194,69,46,.14)}
.jb-miss,.jb-void{color:#7b6a4d;border-color:#a08f68;background:rgba(0,0,0,.05)}
.jb-none{color:#7b6a4d;border-color:#b4a37c}
.cname{font-weight:800;font-size:12.5px;color:#1c1812;margin:3px 0 4px;line-height:1.25}
/* 본문은 자르지 않는다 — 넘치면 fitTexts() 가 글자를 줄여 전부 보이게 한다 */
.ctext{font-size:10.6px;line-height:1.45;color:#3a3229;flex:1;min-height:0;
       white-space:pre-line;overflow:hidden}
/* 원산지 표기 — 이 리뷰가 어느 상품에서 태어났는가. 상성의 근거라 항상 보인다 */
.corigin{font-size:9px;color:#8a6f3f;margin-top:3px;line-height:1.3}
.corigin.hit{color:#7d5a08;font-weight:800}
.corigin.none{color:#a2947a}
.cui{font-size:9.5px;color:#5a4c34;border-top:1px dashed var(--parch-d);
     padding-top:3px;margin-top:3px;line-height:1.35}
.cui .exp{color:#8a2f1c;font-weight:800}
.cfoot{display:flex;align-items:center;gap:4px;margin-top:4px;white-space:nowrap;
       border-top:1px solid var(--parch-d);padding-top:4px;font-size:10px;overflow:hidden}
.tagc{background:#2f2a20;color:#e8d9ae;border-radius:3px;padding:1px 5px;font-size:9.5px}
.ccost{margin-left:auto;font-weight:800}

/* ══ 서명 — 카드를 쓸 때 빈칸에 사인이 그어진다 = 게시(worldview §1.1-2) ══
   ui/signature.html 에 등록한 실제 획을 쓴다. 없으면 기본 필체로 대체.
   pathLength="100" 으로 길이를 정규화해 dasharray 를 하드코딩하지 않는다. */
.sig{position:absolute;left:10px;right:10px;bottom:62px;height:36px;
     pointer-events:none;opacity:0}
.sig svg{width:100%;height:100%;overflow:visible;display:block}
.sig path{fill:none;stroke:#2b2119;stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:100;stroke-dashoffset:100}
.sig .ln{stroke-width:2.3}
.sig .fl{stroke-width:1.4;opacity:.65}
.sig .nib{position:absolute;left:0;top:0;width:20px;height:20px;margin:-16px 0 0 -2px;
          offset-distance:0;opacity:0;offset-rotate:0deg;transform:rotate(-8deg);font-size:15px}
.sig .blot{position:absolute;right:2px;bottom:9px;width:7px;height:7px;border-radius:50%;
           background:#2b2119;transform:scale(0);opacity:.85}
.card.signing .sig{opacity:1}
.card.signing .sig .ln{animation:draw .40s cubic-bezier(.5,.05,.55,.95) forwards}
.card.signing .sig .fl{animation:draw .17s ease-out .34s forwards}
.card.signing .sig .nib{animation:nib .40s cubic-bezier(.5,.05,.55,.95) forwards}
.card.signing .sig .blot{animation:blot .3s ease-out .40s forwards}
.card.signing{transform:translateY(-34px) scale(1.07) rotate(-1deg);z-index:9;
              box-shadow:0 22px 46px rgba(0,0,0,.85)}
/* 날아가는 복제본은 이미 서명이 끝난 상태로 굳혀 둔다 */
.card.signed .sig{opacity:1}
.card.signed .sig path{stroke-dashoffset:0}
.card.signed .sig .nib{display:none}
.card.signed .sig .blot{transform:scale(1)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes nib{0%{opacity:1;offset-distance:0}88%{opacity:1}100%{opacity:0;offset-distance:100%}}
@keyframes blot{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* 카드 투척 */
.fly{position:absolute;z-index:28;pointer-events:none;margin:0;
     transition:transform .3s cubic-bezier(.4,.9,.3,1),opacity .3s ease-in}

/* 판정 도장 4종 + 베스트 리뷰 */
.stampfx{position:absolute;z-index:31;pointer-events:none;
       transform:translate(-50%,-50%) rotate(-14deg) scale(2.6);opacity:0;
       font-weight:900;font-size:32px;letter-spacing:-1px;white-space:nowrap;
       padding:6px 18px;border:4px double currentColor;border-radius:8px;
       text-shadow:0 2px 0 rgba(0,0,0,.25)}
.stampfx.go{animation:stamp .85s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stamp{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(-24deg) scale(2.6)}
  22%{opacity:1;transform:translate(-50%,-50%) rotate(-11deg) scale(.94)}
  32%{transform:translate(-50%,-50%) rotate(-13deg) scale(1.04)}
  70%{opacity:1;transform:translate(-50%,-50%) rotate(-13deg) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) rotate(-13deg) scale(1.06)}
}
.st-origin{color:#e0a94b} .st-fact{color:#5fbf72} .st-normal{color:#b4a894}
.st-fumble{color:#d4553c} .st-miss{color:#8a8272} .st-best{color:#e0a94b}

/* 좋아요 숫자 — 빨간펜 */
.num{position:absolute;z-index:31;pointer-events:none;font-weight:900;font-size:26px;
     color:#e8532f;text-shadow:0 2px 0 #2b2119,0 0 14px rgba(232,83,47,.5);
     transform:translate(-50%,-50%);opacity:0;white-space:nowrap}
.num.go{animation:numup .95s ease-out forwards}
.num.heal{color:#5fbf72;text-shadow:0 2px 0 #14210f,0 0 14px rgba(95,191,114,.5)}
.num.small{font-size:15px}
@keyframes numup{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  18%{opacity:1;transform:translate(-50%,-90%) scale(1.18)}
  32%{transform:translate(-50%,-84%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-160%) scale(.94)}
}

/* 잉크 튀김 */
.splat{position:absolute;width:120px;height:120px;z-index:29;pointer-events:none;
       transform:translate(-50%,-50%) scale(.2);opacity:0}
.splat.go{animation:splat .5s ease-out forwards}
.splat i{position:absolute;border-radius:50%;background:var(--inkc)}
@keyframes splat{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  35%{opacity:.9;transform:translate(-50%,-50%) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}
}

/* 별점 하락 */
.starfall{position:absolute;z-index:31;pointer-events:none;color:var(--gold);
          font-size:22px;transform:translate(-50%,-50%);opacity:0}
.starfall.go{animation:starfall 1s cubic-bezier(.4,0,.8,1) forwards}
@keyframes starfall{
  0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1.2)}
  100%{opacity:0;transform:translate(-50%,120px) rotate(180deg) scale(.6)}
}

/* 흔들림 / 헛발 */
.shake{animation:shake .3s ease-in-out}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-5px,3px)} 40%{transform:translate(5px,-3px)}
  60%{transform:translate(-3px,-2px)} 80%{transform:translate(3px,2px)}
}
.dud{animation:dud .5s ease-out}
@keyframes dud{0%,100%{filter:none} 40%{filter:grayscale(.55) brightness(.82)}}

/* 결과 오버레이 */
.overlay{position:absolute;inset:0;z-index:50;display:none;place-items:center;
         background:rgba(5,4,3,.72);backdrop-filter:blur(2px)}
.overlay.show{display:grid}
.overlay.death{background:rgba(2,2,2,.96)}
.obox{width:460px;text-align:center;padding:30px 26px;border-radius:10px;
      background:linear-gradient(160deg,var(--parch),var(--parch-d));color:var(--inkc);
      border:1px solid #8a744d;box-shadow:0 24px 70px rgba(0,0,0,.8)}
.obox.wide{width:760px;padding:24px 24px}
.obox .oicon{font-size:46px}
.obox h2{font-size:21px;margin:10px 0 6px;letter-spacing:-.4px}
.obox .osub{font-size:12.5px;color:#4a4136;line-height:1.6}
.obox .ogold{margin-top:12px;font-weight:800;font-size:15px;color:#9a6b12}
.obox .obtns{margin-top:18px;display:flex;gap:8px;justify-content:center}
/* 승리 보상 — 이번 전투 대상의 리뷰 등재 (ADR-011 근거 ②) */
.rwrow{display:flex;gap:10px;justify-content:center;margin-top:12px}
.rwcard{width:206px;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;
        border:1px solid #8a744d;background:linear-gradient(160deg,var(--parch),var(--parch-d));
        color:var(--inkc);display:flex;flex-direction:column;gap:4px;font-family:inherit;
        box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .12s;font-size:12px}
.rwcard:hover{transform:translateY(-4px);outline:2px solid var(--gold)}
.rwcard .rhead{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:#9a6b12}
.rwcard .rname{font-weight:800;font-size:13px;color:#1c1812;line-height:1.3}
.rwcard .rtext{font-size:10px;line-height:1.5;color:#3a3229;white-space:pre-line}
.rwcard .rui{font-size:9.5px;color:#5a4c34;border-top:1px dashed var(--parch-d);padding-top:3px}
.overlay.death .obox{background:none;border:none;box-shadow:none;color:var(--ink)}
.overlay.death .oicon{animation:stardie 2.2s ease-out forwards}
@keyframes stardie{0%{opacity:1;text-shadow:0 0 26px rgba(224,169,75,.8)}
  60%{opacity:.5;text-shadow:0 0 8px rgba(224,169,75,.3)}
  100%{opacity:.16;text-shadow:none}}
.overlay.death h2{color:#cfc4b0}
.overlay.death .osub{color:#7a7062}
.overlay.death .ogold{color:var(--dim)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:300px;transform:translateX(-50%);z-index:950;
       background:var(--slab);border:1px solid var(--red);color:#f0b0a0;
       padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;
       pointer-events:none}
.toast.show{opacity:1}

/* 엔진 로그 패널 */
.logbox{width:1344px;margin:8px auto 20px;background:var(--slab);
        border:1px solid var(--edge);border-radius:6px;font-size:11.5px}
.logbox summary{cursor:pointer;padding:7px 12px;color:var(--dim);letter-spacing:.3px}
.logbox summary:hover{color:var(--ink)}
.loglines{max-height:180px;overflow:auto;padding:4px 14px 10px;
          font-family:ui-monospace,monospace;line-height:1.7;color:var(--dim)}
.loglines div b{color:var(--ink)}

/* 상단바는 무대를 가리지 않게 얇게 */
.topbar{height:34px;font-size:12.5px}

/* 상태 없음 안내 */
.errbox{width:520px;margin:120px auto;text-align:center}
</style>

<script src="state.js"></script>
<script src="engine.js"></script>
<body>
<script>document.body.insertAdjacentHTML('afterbegin', RH.ui.topbar('map'));</script>

<div class="wrap">
  <div class="screen" id="screen">
    <div class="grain"></div>
    <canvas id="pfx"></canvas>
    <div class="stage">
      <div class="intent" id="intentBar">
        <span class="ico" id="inIco">📦</span>
        <span><span class="lab">발송 예정</span><br><span class="val" id="inName">–</span></span>
        <span class="num" id="inVal"></span>
      </div>

      <div class="eplate">
        <div class="ename"><span id="eName">–</span><span class="tiny" id="eTier"></span></div>
        <div class="rating">
          <span class="st" id="eStars">★★★★★</span>
          <span class="n" id="eReviews"></span>
          <span class="n" id="eTurn"></span>
        </div>
        <div class="egauge"><span class="ghostbar" id="eGhost"></span><i id="eBar"></i><span id="eWill"></span></div>
        <div class="nulls" id="eNulls"></div>
        <div class="emods" id="eMods"></div>
      </div>

      <div class="gearcol l" id="gearL"></div>
      <div class="enemybox drop" id="enemyBox" data-zone="enemy">
        <div class="stealthnote">🌫 판매자가 잠적했다 — [배송] 계열 리뷰만 도달한다</div>
        <div class="ebody" id="eBody"></div>
      </div>
      <div class="gearcol r" id="gearR"></div>

      <div class="hero drop" id="heroBox" data-zone="me"><img src="../assets/hero-back.png" alt=""></div>
      <div class="mygear" id="myGear"></div>

      <div class="trash drop" id="trashBox" data-zone="trash">
        <span class="ti">🗑</span>
        <span><b>초고 폐기함</b><span class="tn">여기에 놓으면 퇴고 — ✍1, 1장 버리고 1장 받는다</span></span>
      </div>
    </div>

    <div class="verdict" id="verdict">
      <div class="burstfx" id="burstfx"></div>
      <div class="vb" id="vBadge"></div>
      <div class="vnote" id="vNote"></div>
      <div class="vnum" id="vNum"></div>
    </div>

    <div class="hand">
      <div class="hintbar" id="hintbar"></div>

      <div class="pstatus drop" id="pstatus" data-zone="me">
        <div class="who" id="pWho"></div>
        <div class="pwill">
          <span class="lb">🧠 의지</span>
          <span class="pbar"><i id="pBar"></i><span id="pWill"></span></span>
        </div>
        <div class="trustrow">
          <span class="lb">신뢰도</span>
          <span class="trust" id="trust"></span>
        </div>
        <div class="critnote" id="critNote"></div>
        <div class="pmisc" id="pMisc"></div>
        <div class="ppile">뽑을 카드 <b id="drawN">–</b> · 버린 카드 <b id="discN">–</b></div>
      </div>

      <div class="cards" id="cards"></div>

      <div class="ctrl">
        <div class="orb"><div><b id="energy">3</b><br><em>✍ 필력</em></div></div>
        <div class="ctrlbtns" id="ctrlBtns"></div>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>
  </div>

  <details class="logbox" id="logbox">
    <summary>🛠 엔진 로그 (개발 확인용)</summary>
    <div class="loglines" id="logLines"></div>
  </details>
</div>

<script>
(() => {
  const D = window.RH_DATA;
  const $ = (s) => document.querySelector(s);
  const esc = RH.ui.esc;
  // 데이터 표시 문구의 「피해/데미지」를 게임 언어 「좋아요」로 (GDD §2 규칙 7)
  const likeify = (s) => String(s || '')
    .replace(/의지 데미지/g, '좋아요').replace(/의지 피해/g, '좋아요')
    .replace(/데미지/g, '좋아요').replace(/피해/g, '좋아요');

  // ── 적 결정: 런 노드 우선, 없으면 ?enemy= 디버그 단독 전투 ──
  const qs = new URLSearchParams(location.search);
  const run = RH.run();
  const node = RH.currentNode();
  const runMode = !!(run && node && node.enemy);
  const enemyId = runMode ? node.enemy : (qs.get('enemy') || 'E01');
  const enemyDef = D.enemies.find((e) => e.id === enemyId);

  if (!runMode) {
    const nav = document.querySelector('.topbar nav');
    if (nav) nav.insertAdjacentHTML('beforebegin',
      '<span class="chip" style="border-color:var(--red);color:#e08b72">디버그 전투</span>');
  }
  if (!enemyDef) {
    $('.wrap').innerHTML = `<div class="panel errbox"><h2>알 수 없는 상품</h2>
      <p class="tiny" style="margin:10px 0">적 「${esc(enemyId)}」의 정보가 없다. ?enemy=E01 로 다시 시도.</p>
      <a class="btn" href="combat.html?enemy=E01">E01 전투로</a> <a class="btn ghost" href="index.html">메인으로</a></div>`;
    return;
  }

  const THUMB = { E01: '👺', E01T: '👺', E02: '🪓', E03: '🧝', E04: '🥷', E05: '💂', B01: '🕴️', B01T: '🕴️' };
  const ART = {
    E01: 'enemy-goblin.png', E01T: 'enemy-goblin.png', E02: 'enemy-orc.png',
    E03: 'enemy-elf.png', E04: 'enemy-thief.png', E05: 'enemy-knight.png',
    B01: 'enemy-boss.png', B01T: 'enemy-boss.png',
  };
  /** 전투 무대 배경 — 상대와 노드 종류로 고른다. 없으면 scene.png 폴백.
   *  같은 배경을 매 전투 재탕하면 단조로우므로 층·상대별로 갈아 끼운다. */
  const SCENE_BY_ENEMY = {
    E01: 'market', E01T: 'market',   // 잡상인 — 노천 좌판 골목
    E02: 'arcade',                   // 오크 — 상가 아케이드
    E03: 'basement',                 // 엘프 — 습한 지하 (이펙트가 어둠에서 산다)
    E04: 'warehouse',                // 배송 도적 — 물류 창고
    E05: 'rest',                     // 나르시시스트 기사 — 등불 아래가 어울린다
    B01: 'boss', B01T: 'boss',
  };
  const SCENE_BY_TIER = { elite: 'basement', boss: 'boss' };
  function stageScene() {
    const key = SCENE_BY_ENEMY[enemyDef.id] || SCENE_BY_TIER[enemyDef.tier] || 'arcade';
    return `../assets/scene-${key}.png`;
  }
  const TIER = { normal: '일반 셀러', elite: '파워 셀러', boss: '본사 직영' };
  const ICO = { attack: '📦', gimmick: '📢', stealth: '🌫', buff: '🛠', steal: '🪙' };
  /** 대상 표기 — 만물마켓에선 **무엇이든 상품이다.** 판매자도, 그가 든 칼도, 내 장비도
   *  각각 별개의 상품이고 각각 따로 리뷰가 달린다. 그래서 대상을 「본체 / 부속」으로
   *  나누어 부르지 않고 저마다의 상품 이름으로 부른다 (worldview §1.1 · card-system-v2 §3). */
  const tgtLabel = (t) => t === 'enemy' ? `「${enemyDef.name}」`
    : t === 'enemy_equipment' ? `「${enemyDef.name}」의 구성품`
    : '내가 산 상품 (내 장비)';

  // ── 전투 생성 (v2 API — packages/sim/src/policies.ts 사용법 준수) ──
  const cards = RHEngine.buildCardIndex(D.cards);
  const deck = (runMode && run.deck && run.deck.length ? run.deck.slice() : D.startingDeck.slice());
  if (enemyDef.tier === 'boss') deck.push(...D.bossExtra);

  const battle = new RHEngine.Battle({
    cards,
    enemy: enemyDef,
    deck,
    rng: RHEngine.mulberry32((Math.random() * 0xffffffff) >>> 0),
    gold: runMode ? run.gold : 0,
    initialSuitCounters: runMode ? run.suitCounters : undefined,
    initialLastSuit: runMode ? (run.lastSuit || undefined) : undefined,
    collectLog: true,
  });
  // 플레이어 의지는 런에서 잇는다 (CONTRACT 전투 페이지 계약)
  if (runMode) {
    battle.state.player.will = run.will;
    battle.state.player.maxWill = run.maxWill;
  }
  window.RH_BATTLE = battle; // 개발·E2E 검증용 노출 (debug.js 훅과 같은 결)

  const st = battle.state;
  const def = (id) => cards.byId.get(id);
  const scr = $('#screen');

  // ── 상태 ──
  let myEq = 0, enEq = 0;       // 마지막으로 지목한 내 장비 / 적 구성품 인덱스
  let mode = 'play', giftSrc = 0;
  let busy = false, resultHandled = false;
  let retreatArmed = false, retreatTimer = 0;
  let prevEWill = Math.max(0, st.enemy.will);
  let winDelta = 0, skipReward = false; // 승리 정산 골드 / 디버그 훅의 보상 생략
  let held = null;              // 끌거나 고른 카드 uid (드래그·클릭 공용)
  let dragging = false;         // 실제 HTML5 드래그 중인가

  // ── 유틸 ──
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 1700);
  }
  const stars5 = (ratio) => {
    const n = Math.max(0, Math.min(5, Math.ceil(ratio * 5)));
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  };
  const rel = (el) => {
    const s = scr.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2, r, s };
  };
  const snap = () => ({
    eWill: Math.max(0, st.enemy.will), pWill: Math.max(0, st.player.will),
    gold: st.player.gold, dur: st.enemy.equipment.map((q) => q.durability),
  });
  const sample = (arr, n) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a.slice(0, n);
  };

  // ── 이펙트 (잉크·도장·별점·빨간펜) ──
  function spawn(cls, html, x, y, life) {
    const el = document.createElement('div');
    el.className = cls; el.innerHTML = html;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    scr.appendChild(el);
    requestAnimationFrame(() => el.classList.add('go'));
    setTimeout(() => el.remove(), life);
  }
  const stampFx = (cls, label, x, y) => spawn('stampfx ' + cls, esc(label), x, y, 900);
  const num = (text, x, y, heal, small) =>
    spawn('num' + (heal ? ' heal' : '') + (small ? ' small' : ''), esc(text), x, y, 1000);
  const starOff = (x, y) => spawn('starfall', '★', x, y, 1050);
  function splat(x, y) {
    const el = document.createElement('div');
    el.className = 'splat';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    for (let i = 0; i < 11; i++) {
      const r = 4 + Math.abs(Math.sin(i * 12.9898) * 13);
      const ang = i * 2.399, rad = 12 + Math.abs(Math.cos(i * 4.1)) * 42;
      const d = document.createElement('i');
      d.style.width = d.style.height = r + 'px';
      d.style.left = (60 + Math.cos(ang) * rad - r / 2) + 'px';
      d.style.top = (60 + Math.sin(ang) * rad - r / 2) + 'px';
      el.appendChild(d);
    }
    scr.appendChild(el);
    requestAnimationFrame(() => el.classList.add('go'));
    setTimeout(() => el.remove(), 620);
  }
  function shakeFx() { scr.classList.add('shake'); setTimeout(() => scr.classList.remove('shake'), 360); }
  function dudFx() { scr.classList.add('dud'); setTimeout(() => scr.classList.remove('dud'), 520); }

  /** ── 앰비언트 파티클 — 무대 뒤에서 떠도는 불씨. 액션감만 얹고 조작을 방해하지 않는다.
   *  · canvas 1장 + requestAnimationFrame 1개. 총량 상한 MAX 로 저사양에서도 일정 부하.
   *  · prefers-reduced-motion 또는 설정의 「화면 흔들림」 off 면 아예 돌리지 않는다.
   *  · 원산지·팩트가 꽂히면 그 자리에서 불씨가 확 일었다가 잦아든다(burst). */
  const PFX_PRESET = {
    ember: { n: 52, rgb: [232, 176, 84], size: [1.2, 3.2], vy: [-0.34, -0.10], vx: [-0.10, 0.10],
             life: [3.2, 7.5], sway: 0.55, glow: true, alpha: 0.85 },
    snow:  { n: 64, rgb: [232, 220, 192], size: [1.2, 2.8], vy: [0.10, 0.34], vx: [-0.08, 0.08],
             life: [6, 13], sway: 0.9, glow: false, alpha: 0.7 },
  };
  const pfx = (() => {
    const W = 1344, H = 768, MAX = 110;
    const cv = document.getElementById('pfx');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const on = !reduce && RH.settings().shake !== false;
    const api = { burst() {}, preset() {}, enabled: on };
    if (!cv || !on) { if (cv) cv.style.display = 'none'; return api; }
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    let cfg = PFX_PRESET.ember;
    const rnd = (a, b) => a + Math.random() * (b - a);
    const ps = [];
    function make(x, y, boost) {
      return {
        x: x ?? rnd(0, W), y: y ?? rnd(H * 0.25, H + 20),
        vx: rnd(cfg.vx[0], cfg.vx[1]) * (boost || 1),
        vy: rnd(cfg.vy[0], cfg.vy[1]) * (boost || 1),
        r: rnd(cfg.size[0], cfg.size[1]),
        life: rnd(cfg.life[0], cfg.life[1]), age: 0,
        ph: rnd(0, 6.28), temp: !!boost,
      };
    }
    // 첫 프레임부터 화면이 비지 않게, 시작 시점의 나이를 흩어 둔다
    for (let i = 0; i < cfg.n; i++) { const p = make(); p.age = rnd(0, p.life * 0.8); ps.push(p); }
    let last = 0, raf = 0;
    function frame(t) {
      const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
      ctx.clearRect(0, 0, W, H);
      for (let i = ps.length - 1; i >= 0; i--) {
        const p = ps[i];
        p.age += dt;
        if (p.age > p.life || p.y < -20) {
          if (p.temp || ps.length > cfg.n) { ps.splice(i, 1); continue; }
          Object.assign(p, make());
          continue;
        }
        p.x += (p.vx + Math.sin(p.ph + p.age * 1.6) * cfg.sway * 0.16) * dt * 60;
        p.y += p.vy * dt * 60;
        const k = p.age / p.life;
        const a = Math.min(1, Math.sin(Math.PI * k) * 1.8) * (p.temp ? 1 : cfg.alpha);
        ctx.beginPath();
        ctx.fillStyle = `rgba(${cfg.rgb[0]},${cfg.rgb[1]},${cfg.rgb[2]},${a.toFixed(3)})`;
        if (cfg.glow) { ctx.shadowColor = `rgba(${cfg.rgb[0]},${cfg.rgb[1]},${cfg.rgb[2]},.85)`; ctx.shadowBlur = 8; }
        else ctx.shadowBlur = 0;
        ctx.arc(p.x, p.y, p.r, 0, 6.2832);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
      else if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
    });
    api.burst = (x, y, n) => {
      const room = Math.max(0, MAX - ps.length);
      for (let i = 0; i < Math.min(n || 18, room); i++) {
        const p = make(x + rnd(-26, 26), y + rnd(-18, 18), 3.4);
        p.life = rnd(0.5, 1.3); p.r *= 1.25;
        ps.push(p);
      }
    };
    api.preset = (name) => { if (PFX_PRESET[name]) cfg = PFX_PRESET[name]; };
    return api;
  })();

  function showDiffs(pre) {
    const eP = rel($('#enemyBox')), hP = rel($('#heroBox'));
    const eW = Math.max(0, st.enemy.will), pW = Math.max(0, st.player.will);
    if (pre.eWill > eW) num(`좋아요 +${pre.eWill - eW}`, eP.x, eP.y - 34);
    if (pre.eWill < eW) num(`의지 +${eW - pre.eWill}`, eP.x, eP.y - 34, true);
    if (pre.pWill > pW) num(`좋아요 +${pre.pWill - pW}`, hP.x + 20, hP.y - 40);
    if (pre.pWill < pW) num(`의지 +${pW - pre.pWill}`, hP.x + 20, hP.y - 40, true);
    if (st.player.gold !== pre.gold) {
      const d = st.player.gold - pre.gold;
      num(`🪙 ${d > 0 ? '+' : ''}${d}`, hP.x + 20, hP.y + 6, d > 0, true);
    }
    if (Math.floor(pre.eWill / st.enemy.maxWill * 5) > Math.floor(eW / st.enemy.maxWill * 5)) {
      const s = rel($('#eStars'));
      starOff(s.x + 26, s.y);
    }
    st.enemy.equipment.forEach((q, i) => {
      const b = pre.dur[i];
      if (b !== undefined && q.durability < b) {
        const el = document.querySelector(`[data-eeq="${i}"]`);
        if (el) { const p = rel(el); num(`내구도 −${b - q.durability}`, p.x, p.y, false, true); }
      }
    });
  }

  // ── 드롭 존 ↔ 대상 ────────────────────────────────
  /** 존 DOM → 대상 서술 {kind, idx} */
  function zoneInfo(z) {
    if (!z) return null;
    if (z.dataset.eeq !== undefined) return { kind: 'enemy_equipment', idx: Number(z.dataset.eeq) };
    if (z.dataset.meq !== undefined) return { kind: 'my_equipment', idx: Number(z.dataset.meq) };
    if (z.dataset.zone === 'enemy') return { kind: 'enemy' };
    if (z.dataset.zone === 'me') return { kind: 'my_equipment', idx: myEq };
    if (z.dataset.zone === 'trash') return { kind: 'trash' };
    return null;
  }
  /** 이 존이 이 카드의 대상인가 — 카드의 target 이 곧 대상 종류다 (엔진 규칙과 동일).
   *  폐기함만은 예외로 아무 카드나 받는다(필력 1이 있을 때). */
  function zoneAccepts(z, d) {
    const info = zoneInfo(z);
    if (!info || !d) return false;
    if (z.classList.contains('dead')) return false;
    if (info.kind === 'trash') return st.player.energy >= 1;
    return info.kind === d.target;
  }

  // ── 판정 미리보기 — 엔진 submitReview 와 동일 규칙 (policies.ts evaluate 이식) ──
  /** @param d 카드 정의 @param info {kind, idx} — 생략하면 카드의 기본 대상 + 현재 지목 인덱스 */
  /**
   * 판정 미리보기 — **계산은 전부 엔진이 한다**(battle.previewSubmit).
   * 화면이 규칙을 다시 구현하면 밸런스를 고칠 때 표시값만 조용히 틀려지므로,
   * 여기서는 엔진 결과를 화면 표기(j/likes/gauge)로 옮기기만 한다.
   */
  function judgePreview(uid, info) {
    const t = info || {};
    const opts = t.kind === 'my_equipment' ? { myEquipmentIndex: t.idx ?? myEq }
      : t.kind === 'enemy_equipment' ? { enemyEquipmentIndex: t.idx ?? enEq }
      : {};
    const pv = battle.previewSubmit(uid, opts);
    return { j: pv.blocked === 'not_review' ? 'none' : (pv.blocked || pv.judgement), ...pv };
  }

  // 판정 뱃지 (design/card-system-v2 §8: 원산지 ★ / 팩트 ● / 헛소리 ⚠ / 일반 무표시)
  const JB = {
    origin: ['jb-origin', '★ 원산지'], fact: ['jb-fact', '● 팩트'],
    fumble: ['jb-fumble', '⚠ 헛소리'], normal: null,
    miss: ['jb-miss', '빗나감'], void: ['jb-void', '대상 없음'], none: ['jb-none', '무판정'],
  };
  const STAMP_L = { origin: '원산지!', fact: '팩트!', normal: '일반', fumble: '헛소리…' };
  // 말풍선 라벨엔 배율을 같이 박는다 — 「일반」이 상성 없음(×1.0)이라는 사실이 보여야 한다
  const V_LABEL = {
    origin: '원산지! ×1.5 +1', fact: '팩트! ×1.5', normal: '일반 ×1.0', fumble: '헛소리… ×0.5',
    miss: '빗나감', void: '리뷰할 상품 없음', none: '무판정',
  };
  const enemyName = (id) => (D.enemies.find((e) => e.id === id) || {}).name || id;
  /** 이 카드가 태어난 상품 이름 (없으면 null — 전생 상품·해금 카드는 영구히 원산지 미발동) */
  const bornOf = (d) => d.origin ? (d.origin.equipment || enemyName(d.origin.enemy)) : null;
  /** 그 상품이 이번 전투에 실제로 있는가 = 원산지가 터질 수 있는가 */
  const eqNamesHere = new Set(enemyDef.equipment.map((q) => q.name));
  const originHere = (d) => !!d.origin
    && (d.origin.enemy === enemyDef.id || (d.origin.equipment && eqNamesHere.has(d.origin.equipment)));

  // ── 판정 말풍선 — 그 대상 기준으로 계산해 존 위에 띄운다 ──
  function verdictNote(d, j, info) {
    const e = st.enemy;
    if (j === 'origin') {
      return info.kind === 'enemy_equipment'
        ? '직접 써 본 사람의 증언 — 평가 불가 항목도 통한다'
        : '직접 산 사람의 증언 — 평가 불가 항목도 통한다';
    }
    if (j === 'fact') return `[${d.tag}]가 이 상품의 실제 약점이다 — 겪지 않았어도 맞는 말이다`;
    if (j === 'fumble') return `이 상품엔 [${d.tag}] 항목이 없다 — 헛소리로 읽힌다`;
    if (j === 'miss') return '판매자가 잠적했다 — [배송] 계열 리뷰만 도달한다';
    if (j === 'void') return '이 판매자의 구성품은 전량 품절 — 리뷰할 상품이 없다';
    if (j === 'none') return '진상 화법 — 팩트 원칙 바깥의 언어라 배율을 받지 않는다';
    if (info.kind === 'my_equipment') return '찬양 리뷰 — 좋은 평가는 그 상품의 존재를 강화한다';
    // 「일반」은 맞은 게 아니라 **상관없는 리뷰를 갖다 붙인 것**이다. 그 사실이 읽혀야 한다.
    const born = bornOf(d);
    return (born ? `「${born}」 후기다` : '전생에 쓴 후기다')
      + ' — 이 상품과는 무관하다. 원산지도 약점도 아니라 배율이 없다.';
  }

  function showVerdict(d, zone) {
    const vd = $('#verdict');
    const info = zoneInfo(zone);
    if (!info) { vd.classList.remove('show'); return; }
    let kind, label, note, bits = [];
    if (info.kind === 'trash') {
      const ok = zoneAccepts(zone, d);
      kind = ok ? 'normal' : 'bad';
      label = ok ? '초고 폐기' : '필력 부족';
      note = ok
        ? '이 초고를 구겨 버리고 새 리뷰를 한 장 받는다 — 태그 사냥.'
        : '퇴고에는 필력이 1 필요하다.';
      bits = ok ? ['✍1 소모', '손패 1장 교체'] : [];
    } else if (!zoneAccepts(zone, d)) {
      kind = 'bad';
      label = '대상 아님';
      note = `이 리뷰는 ${tgtLabel(d.target)} 앞으로만 낼 수 있다. 다른 상품엔 놓이지 않는다.`;
    } else {
      const pv = judgePreview(held, info);   // held = 끌거나 고른 카드 uid
      kind = pv.j;
      label = V_LABEL[pv.j];
      note = verdictNote(d, pv.j, info);
      if (pv.likes != null) bits.push(`👍 예상 좋아요 ${pv.likes}`);
      if (pv.gauge) bits.push(`신뢰도 ${pv.gauge > 0 ? '+' : ''}${pv.gauge}`);
      if (!bits.length) bits.push(likeify(d.ui));
      bits.push(`✍${d.cost}`);
    }
    vd.className = 'verdict show v-' + kind;
    $('#burstfx').style.display = (kind === 'origin' || kind === 'fact') ? 'block' : 'none';
    $('#vBadge').textContent = `${label} — ${d.name}`;
    $('#vNote').textContent = note;
    $('#vNum').textContent = bits.join(' · ');
    const s = scr.getBoundingClientRect(), a = zone.getBoundingClientRect();
    vd.style.left = Math.min(s.width - vd.offsetWidth - 12,
      Math.max(12, a.left - s.left - 24)) + 'px';
    vd.style.top = Math.max(8, a.top - s.top - vd.offsetHeight - 18) + 'px';
  }

  // ── 드롭 존 강조 상태 ──
  function markZones(d) {
    scr.classList.add('dragging');
    document.querySelectorAll('.drop').forEach((z) => {
      z.classList.toggle('nomatch', !zoneAccepts(z, d));
      z.classList.remove('hot');
    });
  }
  function clearZones() {
    scr.classList.remove('dragging');
    document.querySelectorAll('.drop').forEach((z) => z.classList.remove('nomatch', 'hot', 'nope'));
    $('#verdict').classList.remove('show');
  }
  function heldDef() {
    if (held == null) return null;
    const c = st.player.hand.find((x) => x.uid === held);
    return c ? def(c.cardId) : null;
  }
  function unhold() {
    held = null; dragging = false;
    clearZones();
    document.querySelectorAll('.card.sel,.card.ghost')
      .forEach((el) => el.classList.remove('sel', 'ghost'));
    paintHint();
  }

  // ── 그리기 ──
  function paintIntent() {
    const e = st.enemy;
    const a = e.def.actions.find((x) => x.id === e.intentId);
    if (!a) return;
    $('#inIco').textContent = ICO[a.aType] || '📦';
    $('#inName').textContent = a.name;
    const dmg = a.effects.find((f) => f.op === 'damage')?.value;
    let extra = '';
    if (e.charging) extra = ` · 준비 중, ${e.charging.remaining}턴 후`;
    else if (a.chargeTurns > 0) extra = ' · 준비형';
    $('#inVal').textContent = (dmg !== undefined ? `좋아요 ${dmg}` : '') + extra;
  }

  function paintEnemy() {
    const e = st.enemy;
    const w = Math.max(0, e.will), pct = (w / e.maxWill) * 100;
    $('#eName').textContent = e.def.name;
    $('#eTier').textContent = ` ${TIER[e.def.tier]}`;
    $('#eStars').textContent = stars5(w / e.maxWill);
    $('#eReviews').textContent = `· 리뷰 ${1000 + e.maxWill * 7}건`;
    $('#eTurn').textContent = `· 턴 ${st.turn}`;
    if (w < prevEWill) {
      const g = $('#eGhost');
      g.style.transition = 'none';
      g.style.width = (prevEWill / e.maxWill) * 100 + '%';
      requestAnimationFrame(() => { g.style.transition = ''; g.style.width = pct + '%'; });
    } else $('#eGhost').style.width = pct + '%';
    prevEWill = w;
    $('#eBar').style.width = pct + '%';
    $('#eWill').textContent = `의지 ${w} / ${e.maxWill}`;
    $('#eNulls').innerHTML =
      e.def.weaknessTags.map((t) => `<span class="weak">약점: #${esc(t)}</span>`).join('')
      + (e.def.nullTags.map((t) => `<span class="null">평가 불가: ${esc(t)}</span>`).join('')
         || '<span class="tiny">평가 불가 항목 없음</span>');
    const mods = [];
    for (const b of e.buffs)
      mods.push(`<span class="m bad">📈 공격 +${b.value}${b.protectedBy ? ' (알바 리뷰 — 저격 카드로만 제거)' : ''}</span>`);
    if (e.damageReductionNextHit > 0) mods.push(`<span class="m bad">🛡 다음 리뷰 −${e.damageReductionNextHit}</span>`);
    if (e.reflectNextHit > 0) mods.push(`<span class="m bad">🪞 반사 ${e.reflectNextHit}</span>`);
    if (e.stunTurns > 0) mods.push(`<span class="m good">💫 기절 ${e.stunTurns}턴</span>`);
    for (const d of e.debuffs) {
      const label = d.kind === 'attack_halve' ? '공격 −50%' : `공격 −${d.value}`;
      mods.push(d.suspended
        ? `<span class="m">💬 ${label} — 사장님 답글로 정지 (같은 계열 팩트로 재반박)</span>`
        : `<span class="m good">😡 내 악평: ${label} [${d.suit}]</span>`);
    }
    $('#eMods').innerHTML = mods.join('');
    $('#enemyBox').classList.toggle('stealth', e.stealth);
  }

  function paintGear() {
    const e = st.enemy;
    const cols = { l: [], r: [] };
    e.equipment.forEach((q, i) => cols[i % 2 === 0 ? 'l' : 'r'].push({ q, i }));
    for (const side of ['l', 'r']) {
      const el = side === 'l' ? $('#gearL') : $('#gearR');
      el.innerHTML = cols[side].length
        ? '<div class="hd">🛠 구성품 — 각각 별개 상품이다</div>' + cols[side].map(({ q, i }) => {
            const max = e.def.equipment[i].durability;
            return `<div class="slot drop ${q.destroyed ? 'dead' : ''}" data-eeq="${i}">
              <div class="nm">${esc(q.name)}</div>
              <div class="tg">${q.tags.map((t) => `<b>#${esc(t)}</b>`).join('')}</div>
              ${q.destroyed
                ? '<div class="du" style="color:var(--red)">품절 (파괴)</div>'
                : `<div class="dur"><i style="width:${(q.durability / max) * 100}%"></i></div>
                   <div class="du">내구도 ${q.durability}${q.dot ? ` · 도트 −${q.dot.value} (${q.dot.remaining}턴)` : ''}${q.disabledTurns > 0 ? ' · 반품 접수중' : ''}</div>`}
            </div>`;
          }).join('')
        : '';
    }
  }

  function paintMyGear() {
    $('#myGear').innerHTML = '<div class="hd">🎒 내가 산 상품 — ★4~5 찬양 = 버프</div>' +
      st.player.equipment.map((q, i) => `
        <div class="slot drop" data-meq="${i}">
          <div class="nm">${esc(q.def.name)}</div>
          <div class="tg">${q.def.tags.map((t) => `<b>#${esc(t)}</b>`).join('')}
            ${q.def.nullTags.map((t) => `<b style="background:#3a221c;color:#e0a08b">불가:${esc(t)}</b>`).join('')}</div>
          ${q.defense > 0 ? `<div class="def">🛡 방어 <b>${q.defense}</b> <span class="dn">— 적 좋아요를 이만큼 대신 맞는다</span></div>` : ''}
          ${q.attachments.length ? `<div class="at">부착: ${q.attachments.map((a) => `좋아요 +${a.value}`).join(', ')}</div>` : ''}
        </div>`).join('');
  }

  function paintStatus() {
    const p = st.player;
    $('#pWho').textContent = `✍ ${RH.penname() || '무명 대원'} · ${p.disposition}`;
    const w = Math.max(0, p.will);
    $('#pBar').style.width = (w / p.maxWill) * 100 + '%';
    $('#pWill').textContent = `${w} / ${p.maxWill}`;
    document.querySelectorAll('#trust i').forEach((el, i) => {
      const on = i < p.gauge;
      if (on && !el.classList.contains('on')) {
        el.classList.add('pop');
        setTimeout(() => el.classList.remove('pop'), 500);
      }
      el.classList.toggle('on', on);
    });
    const cn = $('#critNote');
    if (p.gauge >= 10 && !p.critUsedThisTurn) { cn.textContent = '🔥 이 라운드 베스트 리뷰 — 발동 가능!'; cn.className = 'critnote hot'; }
    else if (p.critUsedThisTurn) { cn.textContent = `신뢰도 ${p.gauge}/10 · 베스트 리뷰: 이번 턴 사용됨`; cn.className = 'critnote'; }
    else { cn.textContent = `베스트 리뷰까지 ${10 - p.gauge}칸`; cn.className = 'critnote'; }
    const extras = [];
    if (p.reaction) extras.push('🛡 리액션 대기');
    if (p.storedDamageBonus) extras.push(`💢 예약 +${p.storedDamageBonus}`);
    $('#pMisc').textContent = `🪙 ${p.gold}` + (extras.length ? ' · ' + extras.join(' · ') : '');
    $('#energy').textContent = p.energy;
    $('#drawN').textContent = p.deck.length;

  /** ── 등록된 서명 ────────────────────────────────────
   *  ui/signature.html 에서 그린 획(RH.sig())을 카드 서명란 좌표계(140×38)로 맞춰
   *  그대로 쓴다. 없으면 기본 필체로 대체한다. 카드를 낼 때 이 획이 순서대로 그어지고,
   *  그어지는 것 자체가 「리뷰 게시」다(worldview §1.1-2). */
  const DEF_LN = 'M3,25 C11,6 19,3 23,13 C27,23 21,30 17,24 C13,17 23,7 35,9 C47,11 41,28 35,25 C29,22 37,9 51,11 C65,13 59,30 67,25 C75,20 71,9 83,11 C95,13 89,26 97,23 C105,20 101,11 113,15 C125,19 119,26 133,18';
  const DEF_FL = 'M7,31 C42,36 92,33 131,27';

  function buildSignature() {
    let saved = null;
    try { saved = RH.sig(); } catch (e) { saved = null; }
    if (!saved || !saved.strokes || !saved.strokes.length)
      return { paths: [DEF_LN, DEF_FL], cls: ['ln', 'fl'], custom: false };
    const pts = saved.strokes.flat();
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys);
    const sw = Math.max(1, Math.max(...xs) - x0), sh = Math.max(1, Math.max(...ys) - y0);
    const k = Math.min(140 / sw, 38 / sh) * 0.94;
    const ox = (140 - sw * k) / 2 - x0 * k, oy = (38 - sh * k) / 2 - y0 * k;
    const fit = ([x, y]) => [+(x * k + ox).toFixed(1), +(y * k + oy).toFixed(1)];
    const toPath = (s) => {                    // signature.html 과 같은 이차 베지어 평활화
      const q = s.map(fit);
      if (q.length < 2) return `M${q[0][0]},${q[0][1]} l0.1,0`;
      let d = `M${q[0][0]},${q[0][1]}`;
      for (let i = 1; i < q.length - 1; i++) {
        const [x, y] = q[i], [nx, ny] = q[i + 1];
        d += ` Q${x},${y} ${((x + nx) / 2).toFixed(1)},${((y + ny) / 2).toFixed(1)}`;
      }
      return d + ` L${q[q.length - 1][0]},${q[q.length - 1][1]}`;
    };
    const paths = saved.strokes.map(toPath);
    return { paths, cls: paths.map(() => 'ln'), custom: true };
  }

  const SIG = buildSignature();
  const SIG_SVG = (() => {
    // 획순대로 이어 그린다 — 총 0.4초를 획 수로 나눈다
    const per = 0.4 / SIG.paths.length;
    const body = SIG.paths.map((d, i) => {
      const style = SIG.custom
        ? ` style="animation-duration:${per.toFixed(3)}s;animation-delay:${(per * i).toFixed(3)}s"`
        : ''; // 기본 필체는 CSS 의 .ln/.fl 타이밍을 그대로 쓴다
      return `<path class="${SIG.cls[i]}" pathLength="100" d="${d}"${style}/>`;
    }).join('');
    return `<div class="sig"><svg viewBox="0 0 140 38" preserveAspectRatio="none">${body}</svg>`
      + `<span class="nib" style="offset-path:path('${SIG.paths[0]}')`
      + `${SIG.custom ? `;animation-duration:${per.toFixed(3)}s` : ''}">🪶</span>`
      + '<span class="blot"></span></div>';
  })();

  function paintHand() {
    $('#cards').innerHTML = st.player.hand.map((c) => {
      const d = def(c.cardId);
      const pv = judgePreview(c.uid);
      const b = JB[pv.j];
      const badge = b ? `<span class="jb ${b[0]}">${b[1]}</span>` : '';
      // 이 리뷰가 태어난 상품 = 상성의 근거. 그 상품이 이번 전투에 있으면 금색으로 못박는다
      const special = d.kind === 'special';
      const born = bornOf(d);
      const origin = special
        ? '<div class="corigin none">📍 원산지 없음 · 진상 화법은 판정을 받지 않는다</div>'
        : born
          ? `<div class="corigin${originHere(d) ? ' hit' : ''}">📍 원산지 · ${esc(born)}${originHere(d) ? ' — 여기 있다' : ''}</div>`
          : '<div class="corigin none">📍 원산지 없음 · 전생에 쓴 리뷰</div>';
      const foot = special
        ? `<span class="tagc">진상 화법${d.oncePerCombat ? ' · 1회' : ''}</span>`
        : `<span class="tagc">#${esc(d.tag)}</span>`;
      const ui = special
        ? esc(likeify(d.ui))
        : `${pv.likes != null ? `<b class="exp">👍 예상 ${pv.likes}</b> · ` : ''}${esc(likeify(d.ui))}`;
      return `<div class="card ${special ? 'special' : 'review'}${held === c.uid ? ' sel' : ''}"
                   draggable="true" data-card="${c.uid}" data-target="${esc(d.target)}">
        <div class="chead"><span class="cstars">${'★'.repeat(d.stars)}${'☆'.repeat(5 - d.stars)}</span>${badge}</div>
        <div class="cname">${esc(d.name)}</div>
        <div class="ctext">${esc((d.text || '').trim())}</div>
        ${origin}
        ${SIG_SVG}
        <div class="cui">${ui}</div>
        <div class="cfoot">${foot}<span class="ccost">✍${d.cost}</span></div>
      </div>`;
    }).join('');
    fitTexts();
  }

  /** 본문이 잘리지 않게 — 넘치면 글자 크기를 줄여 전부 보이게 한다 */
  function fitTexts() {
    document.querySelectorAll('#cards .ctext').forEach((t) => {
      let s = 10.6, guard = 0;
      t.style.fontSize = s + 'px';
      while (t.scrollHeight > t.clientHeight + 1 && s > 7.4 && guard++ < 30) {
        s -= 0.3;
        t.style.fontSize = s.toFixed(1) + 'px';
      }
    });
  }

  function paintLog() {
    $('#logLines').innerHTML = st.log.slice(-80).map((l) => `<div>${esc(l)}</div>`).join('')
      || '<div>아직 기록 없음</div>';
    const box = $('#logLines');
    box.scrollTop = box.scrollHeight;
  }

  function paint() {
    paintIntent(); paintEnemy(); paintGear(); paintMyGear();
    paintStatus(); paintCtrl(); paintHand(); paintHint(); paintLog();
  }

  // ── 액션 ──
  const cardDom = (uid) => document.querySelector(`[data-card="${uid}"]`);

  function zoneForCard(d) {
    if (d.target === 'my_equipment')
      return document.querySelector(`[data-meq="${myEq}"]`) || $('#pstatus');
    if (d.target === 'enemy_equipment') {
      const el = document.querySelector(`[data-eeq="${enEq}"]:not(.dead)`);
      return el || document.querySelector('[data-eeq]:not(.dead)') || $('#enemyBox');
    }
    return $('#enemyBox');
  }

  function flyClone(el, zone, delay) {
    const from = rel(el), to = rel(zone);
    const fly = el.cloneNode(true);
    fly.className = el.className.replace('signing', 'signed').replace('sel', '') + ' fly';
    fly.style.left = (from.r.left - from.s.left) + 'px';
    fly.style.top = (from.r.top - from.s.top) + 'px';
    fly.style.width = from.r.width + 'px'; fly.style.height = from.r.height + 'px';
    setTimeout(() => {
      scr.appendChild(fly);
      requestAnimationFrame(() => {
        fly.style.transform = `translate(${to.x - from.x}px,${to.y - from.y}px) scale(.3) rotate(9deg)`;
        fly.style.opacity = '0';
      });
      setTimeout(() => fly.remove(), 340);
    }, delay || 0);
  }

  // 리뷰 제출 (v2 — 서명 → 투척 → 도장 연출)
  function doSubmit(uid) {
    if (busy || st.result) return;
    const c = st.player.hand.find((x) => x.uid === uid);
    if (!c) return;
    const d = def(c.cardId);
    const el = cardDom(uid);
    const zone = zoneForCard(d);
    const to = rel(zone);
    const pre = snap();
    let res;
    try {
      res = battle.submitReview(uid, { myEquipmentIndex: myEq, enemyEquipmentIndex: enEq });
    } catch (err) { toast(err.message); return; }
    const jLabel = res.missed ? '빗나감' : STAMP_L[res.judgement];
    st.log.push(`리뷰 제출: ${d.name} → ${jLabel}`);
    busy = true;
    el.classList.remove('ghost', 'sel');
    el.classList.add('signing');
    setTimeout(() => {
      flyClone(el, zone, 0);
      el.style.opacity = '.25';
      setTimeout(() => {
        splat(to.x, to.y);
        stampFx(res.missed ? 'st-miss' : 'st-' + res.judgement, jLabel, to.x, to.y - 54);
        if (res.judgement === 'origin' || res.judgement === 'fact') {
          shakeFx();
          pfx.burst(to.x, to.y, res.judgement === 'origin' ? 26 : 18);
        }
        if (res.judgement === 'fumble' || res.missed) dudFx();
        showDiffs(pre);
        busy = false;
        paint();
        maybeResult();
      }, 380);
    }, 460);
  }

  function doSpecial(uid) {
    const c = st.player.hand.find((x) => x.uid === uid);
    if (!c) return;
    const d = def(c.cardId);
    const el = cardDom(uid);
    const toEnemy = ['damage', 'equipment_damage', 'delay_enemy_action', 'gift_card', 'damage_per_penalty'].includes(d.effect.type);
    const zone = toEnemy ? $('#enemyBox') : $('#pstatus');
    const to = rel(zone);
    const pre = snap();
    try { battle.playSpecial(uid); } catch (err) { toast(err.message); return; }
    st.log.push(`진상 부리기: ${d.name}`);
    busy = true;
    el.classList.remove('ghost', 'sel');
    el.classList.add('signing');
    setTimeout(() => {
      flyClone(el, zone, 0);
      el.style.opacity = '.25';
      setTimeout(() => {
        splat(to.x, to.y);
        showDiffs(pre);
        busy = false;
        paint();
        maybeResult();
      }, 360);
    }, 460);
  }

  function doCrit() {
    if (busy || st.result) return;
    const pre = snap();
    let d;
    try { d = battle.useCritical(); } catch (err) { toast(err.message); return; }
    st.log.push(`베스트 리뷰 발동! (${d})`);
    busy = true;
    const to = rel($('#enemyBox'));
    stampFx('st-best', `베스트 리뷰 · ${d}`, to.x, to.y - 40);
    shakeFx();
    pfx.burst(to.x, to.y, 34);
    setTimeout(() => {
      showDiffs(pre);
      busy = false;
      paint();
      maybeResult();
    }, 560);
  }

  function doEndTurn() {
    if (busy || st.result) return;
    unhold();
    const pre = snap();
    st.log.push(`── 영업 마감 (턴 ${st.turn})`);
    try { battle.endTurn(); } catch (err) { toast(err.message); paint(); return; }
    busy = true;
    $('#intentBar').classList.add('act');
    setTimeout(() => {
      $('#intentBar').classList.remove('act');
      const dP = pre.pWill - Math.max(0, st.player.will);
      if (dP > 0) {
        const h = rel($('#heroBox'));
        splat(h.x + 20, h.y);
        shakeFx();
      }
      showDiffs(pre);
      busy = false;
      paint();
      maybeResult();
    }, 430);
  }

  /** 초고 폐기함 — 카드를 구겨 넣으면 퇴고(필력 1, 1장 버리고 1장 드로우) */
  function doTrash(uid, zone) {
    if (busy || st.result) return;
    const c = st.player.hand.find((x) => x.uid === uid);
    if (!c) return;
    const d = def(c.cardId);
    const el = cardDom(uid);
    const to = rel(zone);
    try { battle.revise(uid); } catch (err) { toast(err.message); return; }
    st.log.push(`퇴고: 「${d.name}」 초고 폐기 → 1장 교체`);
    held = null; dragging = false;
    clearZones();
    busy = true;
    if (el) {
      el.classList.remove('ghost', 'sel');
      flyClone(el, zone, 0);
      el.style.opacity = '.2';
    }
    setTimeout(() => {
      splat(to.x, to.y);
      num('초고 폐기', to.x, to.y - 18, false, true);
      busy = false;
      paint();
    }, 340);
  }

  /** 카드를 이 존에 낸다 — 드래그 드롭과 클릭 폴백의 공통 종착점 */
  function playOnZone(uid, zone) {
    const c = st.player.hand.find((x) => x.uid === uid);
    if (!c) { unhold(); return; }
    const d = def(c.cardId);
    const info = zoneInfo(zone);
    if (!zoneAccepts(zone, d)) {
      zone.classList.add('nope');
      setTimeout(() => zone.classList.remove('nope'), 340);
      toast(info && info.kind === 'trash'
        ? '퇴고에는 필력이 1 필요하다'
        : `「${d.name}」은(는) ${tgtLabel(d.target)} 앞으로만 낼 수 있다`);
      return;
    }
    if (info.kind === 'trash') { doTrash(uid, zone); return; }
    if (info.kind === 'enemy_equipment') enEq = info.idx;
    if (info.kind === 'my_equipment') myEq = info.idx;
    const el = cardDom(uid);
    if (el) el.classList.remove('ghost', 'sel');
    held = null; dragging = false;
    clearZones();
    if (d.kind === 'special') {
      if (d.effect.type === 'gift_card') { mode = 'gift'; giftSrc = uid; paint(); return; }
      doSpecial(uid);
      return;
    }
    doSubmit(uid);
  }

  // ── 끌어다 놓기 (위임 — 손패는 매 턴 다시 그려진다) ──
  document.addEventListener('dragstart', (ev) => {
    const el = ev.target.closest && ev.target.closest('.card[data-card]');
    if (!el || busy || st.result || mode !== 'play') { if (el) ev.preventDefault(); return; }
    held = Number(el.dataset.card);
    dragging = true;
    const d = heldDef();
    if (!d) { held = null; return; }
    el.classList.add('ghost');
    markZones(d);
    paintHint();
    if (ev.dataTransfer) {
      try {
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', String(held));
      } catch (e) { /* 합성 이벤트에는 dataTransfer 가 없을 수 있다 */ }
    }
  });

  document.addEventListener('dragend', () => { if (held != null) unhold(); });

  document.addEventListener('dragenter', (ev) => {
    if (held == null) return;
    const z = ev.target.closest && ev.target.closest('.drop');
    if (!z) return;
    ev.preventDefault();
    const d = heldDef();
    if (!d) return;
    if (zoneAccepts(z, d)) z.classList.add('hot');
    showVerdict(d, z);
  });

  document.addEventListener('dragover', (ev) => {
    if (held == null) return;
    const z = ev.target.closest && ev.target.closest('.drop');
    if (!z) return;
    ev.preventDefault();
    if (ev.dataTransfer) { try { ev.dataTransfer.dropEffect = 'move'; } catch (e) {} }
  });

  document.addEventListener('dragleave', (ev) => {
    const z = ev.target.closest && ev.target.closest('.drop');
    if (!z) return;
    if (ev.relatedTarget && z.contains(ev.relatedTarget)) return;
    z.classList.remove('hot');
  });

  document.addEventListener('drop', (ev) => {
    const z = ev.target.closest && ev.target.closest('.drop');
    if (!z || held == null) return;
    ev.preventDefault();
    z.classList.remove('hot');
    playOnZone(held, z);
  });

  // ── 클릭 폴백: 카드 클릭 → 선택 → 대상 클릭 → 제출 ──
  function onCardClick(uid) {
    const c = st.player.hand.find((x) => x.uid === uid);
    if (!c) return;
    const d = def(c.cardId);
    if (mode === 'revise') {
      mode = 'play';
      try { battle.revise(uid); } catch (err) { toast(err.message); }
      unhold(); paint(); return;
    }
    if (mode === 'gift') {
      mode = 'play';
      try { battle.playSpecial(giftSrc, { giftUid: uid }); } catch (err) { toast(err.message); }
      unhold(); paint(); maybeResult(); return;
    }
    if (held === uid) { unhold(); return; }   // 같은 카드 다시 클릭 = 선택 해제
    document.querySelectorAll('.card.sel').forEach((el) => el.classList.remove('sel'));
    held = uid; dragging = false;
    const el = cardDom(uid);
    if (el) el.classList.add('sel');
    markZones(d);
    showVerdict(d, zoneForCard(d));
    paintHint();
  }

  // ── 종료 처리 (CONTRACT: 런 되써넣기 → 카드 보상 → completeNode / result 직행) ──
  function writeBackRun() {
    run.suitCounters = st.player.suitCounters;
    run.lastSuit = st.player.lastSuit;
  }

  function goldDelta() { return st.player.gold - (runMode ? run.gold : 0); }

  /** 승리 보상 풀 (ADR-011 근거 ②): 이번 전투 대상들 — 적 본체 origin.enemy 일치
   *  + 그 적 장비 origin.equipment 일치 — 의 리뷰 중 미보유 카드 */
  function rewardPool() {
    if (!runMode) return [];
    const owned = new Set(run.deck);
    const eqNames = new Set(enemyDef.equipment.map((q) => q.name));
    return D.cards.filter((c) => c.kind === 'review' && c.origin && !owned.has(c.id)
      && (c.origin.enemy === enemyId || (c.origin.equipment && eqNames.has(c.origin.equipment))));
  }

  function showOverlay(o) {
    const ov = $('#overlay');
    ov.className = 'overlay show' + (o.death ? ' death' : '');
    const btns = (o.btns || [{ label: o.btn || '계속', href: o.href }])
      .map((b) => `<button class="btn primary" data-act="go" ${b.href ? `data-href="${b.href}"` : ''}>${esc(b.label)}</button>`)
      .join('');
    ov.innerHTML = `<div class="obox">
      <div class="oicon">${o.icon}</div>
      <h2>${esc(o.title)}</h2>
      <div class="osub">${o.sub}</div>
      ${o.gold ? `<div class="ogold">${o.gold}</div>` : ''}
      <div class="obtns">${btns}</div>
    </div>`;
  }

  /** 승리 + 카드 보상 오버레이 — 1장 선택(또는 건너뛰기) 후 completeNode */
  function showWinReward(o) {
    const rw = (c) => `<button class="rwcard" data-act="reward" data-id="${c.id}">
      <div class="rhead"><span>${'★'.repeat(c.stars)}</span><span>#${esc(c.tag)} · ✍${c.cost}</span></div>
      <div class="rname">${esc(c.name)}</div>
      <div class="rtext">${esc((c.text || '').trim())}</div>
      <div class="rui">${esc(likeify(c.ui))}</div>
    </button>`;
    const ov = $('#overlay');
    ov.className = 'overlay show';
    ov.innerHTML = `<div class="obox wide">
      <div class="oicon">${o.icon}</div>
      <h2>리뷰가 게시되었다</h2>
      <div class="osub">${o.sub}</div>
      <div class="ogold">${o.goldLine}</div>
      <div class="osub" style="margin-top:14px"><b>전리품 — 이번 전투 대상의 리뷰를 내 목록에 등재한다</b><br>
        직접 이긴 상대의 리뷰라 원산지 보너스가 살아 있다. 1장을 고른다.</div>
      <div class="rwrow">${o.pool.map(rw).join('')}</div>
      <div class="obtns"><button class="btn ghost" data-act="skipreward">등재 없이 ${o.isBoss ? '정복 후기 작성하기' : '지도로 돌아가기'}</button></div>
    </div>`;
  }

  function maybeResult() {
    if (!st.result || resultHandled) return;
    resultHandled = true;
    unhold();
    const r = st.result;
    const reward = enemyDef.tier === 'boss' ? 50 : enemyDef.tier === 'elite' ? 24 : 15;

    if (r === 'win') {
      const surrender = st.stats.surrender;
      const isBoss = enemyDef.tier === 'boss';
      const icon = surrender ? '🏳️' : '🛍️';
      const sub = surrender
        ? '전 구성품이 품절되어 판매자가 영업을 포기했다. 위로금 6골드를 뜯어냈다.'
        : `${esc(enemyDef.name)}의 존재 등급이 바닥났다. ★5 「정복 후기(구매 확정)」 작성 권한 획득.`;
      const goldLine = `정산: 🪙 +${reward}${surrender ? ' (+위로금 6)' : ''}`;
      if (runMode) {
        winDelta = goldDelta() + reward; // 전투 중 증감(갈취·강탈·항복 위로금) + 승리 보상
        run.battlesWon += 1;
        run.will = Math.max(1, st.player.will);
        writeBackRun();
        RH.saveRun(run);
        // 카드 보상: 미보유 대상 리뷰 최대 3장 제시. 디버그 훅(win)·풀 소진 시 생략 → 즉시 정산
        const pool = skipReward ? [] : sample(rewardPool(), 3);
        if (pool.length) {
          showWinReward({ icon, sub, goldLine, pool, isBoss });
          paint();
          return;
        }
        const href = RH.completeNode({ gold: winDelta });
        showOverlay({
          icon, title: '리뷰가 게시되었다', sub, gold: goldLine, href,
          btns: [{ label: isBoss ? '정복 후기 작성하기' : '지도로 돌아가기', href }],
        });
      } else {
        showOverlay({
          icon, title: '리뷰가 게시되었다', sub, gold: goldLine, href: null,
          btns: [{ label: '다시 전투', href: null }, { label: '메인으로', href: 'index.html' }],
        });
      }
    } else if (r === 'lose' || r === 'timeout') {
      let href = null;
      if (runMode) {
        run.will = 0; // 런은 지우지 않는다 — result 가 정산한다 (CONTRACT)
        writeBackRun();
        RH.saveRun(run);
        href = `result.html?outcome=death&enemy=${enemyId}`;
      }
      showOverlay({
        death: true,
        icon: '★',
        title: '별이 꺼졌다',
        sub: r === 'timeout'
          ? '고객센터 상담 시간이 끝났다. 만물대장이 접수 창구를 닫아버렸다.'
          : '의지가 바닥났다. 만물대장이 더는 당신의 리뷰를 싣지 않는다.',
        href,
        btns: runMode
          ? [{ label: '마지막 리뷰 남기기', href }]
          : [{ label: '다시 전투', href: null }, { label: '메인으로', href: 'index.html' }],
      });
    } else if (r === 'retreat') {
      // X07 카드로 이탈 — 보상 포기, 의지 유지
      let href = null;
      if (runMode) {
        run.will = Math.max(1, st.player.will);
        writeBackRun();
        RH.saveRun(run);
        href = RH.completeNode({ gold: goldDelta() });
      }
      showOverlay({
        icon: '🚪',
        title: '주문 취소',
        sub: '"내가 여길 다시 오나 봐라." 보상 없이 전장을 빠져나왔다.',
        href,
        btns: runMode ? [{ label: '지도로 돌아가기', href }] : [{ label: '메인으로', href: 'index.html' }],
      });
    }
    paint();
  }

  /** 택배 개봉 (ADR-024 ③) — 보스에게 가던 보급품을 뜯어 내 장비로 만든다 */
  function doParcel() {
    let got;
    try { got = battle.openParcel(); }
    catch (err) { toast(err.message); return; }
    const run = RH.run();
    if (run) { run.parcel = { opened: true, name: got.name }; RH.saveRun(run); }
    toast(`📦 ${got.name} — 이제 내 장비다. 찬양 리뷰를 붙일 수 있다`);
    st.log.push(`택배 개봉: ${got.name} (#${got.tags.join(' #')})`);
    paint();
  }

  function doRetreat() {
    if (busy || st.result || resultHandled) return;
    if (!retreatArmed) {
      retreatArmed = true;
      paintCtrl();
      clearTimeout(retreatTimer);
      retreatTimer = setTimeout(() => { retreatArmed = false; paintCtrl(); }, 2200);
      return;
    }
    clearTimeout(retreatTimer);
    resultHandled = true;
    unhold();
    st.log.push('항복 — 위로금 6골드를 뜯어내고 물러났다');
    let href = null;
    if (runMode) {
      run.will = Math.max(1, st.player.will); // 의지 유지 (CONTRACT)
      writeBackRun();
      RH.saveRun(run);
      href = RH.completeNode({ gold: goldDelta() + 6 });
    }
    showOverlay({
      icon: '🏳️',
      title: '항복 — 주문 취소',
      sub: '"내가 여길 다시 오나 봐라." 지인 열 명에게 소문내러 간다.',
      gold: '위로금: 🪙 +6',
      href,
      btns: runMode ? [{ label: '지도로 돌아가기', href }] : [{ label: '메인으로', href: 'index.html' }],
    });
    paintLog();
  }

  // ── 입력 (클릭 위임 하나로) ──
  document.addEventListener('click', (ev) => {
    const actEl = ev.target.closest('[data-act]');
    if (actEl) {
      const a = actEl.dataset.act;
      if (a === 'go') {
        const h = actEl.dataset.href;
        if (h) location.href = h; else location.reload();
        return;
      }
      // 승리 보상 — st.result 가 선 상태에서 눌리므로 가드보다 먼저 처리한다
      if (a === 'reward') { location.href = RH.completeNode({ gold: winDelta, deckAdd: actEl.dataset.id }); return; }
      if (a === 'skipreward') { location.href = RH.completeNode({ gold: winDelta }); return; }
      if (busy || st.result) return;
      if (a === 'end') doEndTurn();
      else if (a === 'crit') doCrit();
      else if (a === 'retreat') doRetreat();
      else if (a === 'parcel') doParcel();
      else if (a === 'revise') { unhold(); mode = 'revise'; paint(); }
      else if (a === 'cancelmode') { mode = 'play'; unhold(); paint(); }
      else if (a === 'unhold') unhold();
      return;
    }
    if (busy || st.result) return;
    const cardEl = ev.target.closest('[data-card]');
    if (cardEl) { onCardClick(Number(cardEl.dataset.card)); return; }
    const z = ev.target.closest('.drop');
    if (z) {
      if (held != null) { playOnZone(held, z); return; }
      // 카드를 고르기 전이면 「지목」만 한다 — 손패 뱃지 미리보기가 이 대상 기준이 된다
      const info = zoneInfo(z);
      if (info && info.kind === 'enemy_equipment' && !z.classList.contains('dead')) { enEq = info.idx; paint(); }
      else if (info && info.kind === 'my_equipment' && z.dataset.meq !== undefined) { myEq = info.idx; paint(); }
      return;
    }
    if (held != null) unhold();  // 빈 곳 클릭 = 선택 해제
  });

  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && held != null) unhold(); });

  // ── 디버그 훅 (debug.js 패널의 즉시 승/패) — win 은 카드 보상 생략, 즉시 정산 ──
  window.RH_DEBUG_HOOKS = {
    win() {
      if (st.result || resultHandled) return;
      skipReward = true;
      st.enemy.will = 0;
      st.result = 'win';
      st.log.push('(디버그) 즉시 승리');
      paint(); maybeResult();
    },
    lose() {
      if (st.result || resultHandled) return;
      st.player.will = 0;
      st.result = 'lose';
      st.log.push('(디버그) 즉시 패배');
      paint(); maybeResult();
    },
  };

  // ── 초기화 ──
  // 아트가 아직 없는 적은 이모지 자리표시로 뜬다 (onerror 폴백 — 파일 유무를 코드가 모른다)
  $('#eBody').innerHTML = ART[enemyId]
    ? `<img src="../assets/${ART[enemyId]}" alt=""
         onerror="this.parentNode.textContent='${THUMB[enemyId] || '📦'}'">`
    : (THUMB[enemyId] || '📦');
  // 배경은 실제로 읽힌 뒤에 갈아 끼운다 — 없는 파일이면 CSS 기본값(scene.png)이 그대로 남는다
  (() => {
    const src = stageScene(), probe = new Image();
    probe.onload = () => { $('#screen').style.backgroundImage = `url('${src}')`; };
    probe.src = src;
  })();
  $('#trust').innerHTML = Array.from({ length: 10 }, () => '<i></i>').join('');
  st.log.push(`전투 개시: ${enemyDef.name} (${TIER[enemyDef.tier]})${runMode ? ` · 1막 ${run.floor}층` : ' · 디버그 단독 전투'}`);
  paint();
  window.addEventListener('load', fitTexts);  // 웹폰트 로드 후 한 번 더 맞춘다
})();
</script>
<script src="debug.js"></script>
</body>
