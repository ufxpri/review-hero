<meta charset="utf-8">
<title>이세계 리뷰용사 — 계정</title>
<link rel="stylesheet" href="shared.css">
<style>
.wrap{max-width:960px;margin:26px auto;padding:0 18px;display:flex;flex-direction:column;gap:14px}
h1{font-size:19px;letter-spacing:-.4px}
.grid{display:grid;grid-template-columns:400px 1fr;gap:14px;align-items:start}

/* 서명 미리보기 — 등록부의 양피지 서명란을 그대로 축소 */
.sigpad{position:relative;width:100%;aspect-ratio:660/236;border-radius:8px;
        border:2px solid var(--inkc);box-shadow:4px 4px 0 rgba(0,0,0,.5);overflow:hidden;
        background-color:var(--parch);
        background-image:repeating-linear-gradient(92deg,rgba(120,100,60,.05) 0 2px,transparent 2px 5px),
                         linear-gradient(160deg,var(--parch),var(--parch-d))}
.sigpad canvas{position:absolute;inset:0;width:100%;height:100%}
.sigpad .rule{position:absolute;left:8%;right:8%;bottom:23%;height:1px;background:var(--parch-d)}
.sigpad .rule::after{content:"×";position:absolute;left:-18px;top:-10px;font-size:15px;color:var(--parch-d)}
.sigpad .nosig{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
        color:#a08f68;font-size:12.5px;line-height:1.7}
.whois{display:flex;align-items:baseline;gap:8px;margin-top:11px}
.whois b{font-size:17px;color:var(--gold)}
.whois span{font-size:11.5px;color:var(--dim)}

/* 누적 통계 타일 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--edge);border-radius:5px;background:rgba(0,0,0,.3);
      padding:10px 12px}
.tile .k{font-size:11px;color:var(--dim);letter-spacing:.3px}
.tile .v{font-size:21px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:11px;font-weight:400;color:var(--dim);margin-left:2px}

/* 시작 덱 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid rgba(107,86,54,.3)}
th{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.4px;white-space:nowrap}
td.no{color:#5e564a;font-variant-numeric:tabular-nums;width:34px}
td .nm{font-weight:700}
td .kind{font-size:11px;color:var(--dim)}
.suit{font-size:11px;border-radius:3px;padding:2px 7px;background:#2f2a20;color:#e8d9ae}
td.cost{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;width:64px}

/* 해금 트리 자리 — 잠금 */
.lock{display:flex;align-items:center;gap:14px;padding:20px 16px;opacity:.85}
.lock .ico{font-size:26px;filter:grayscale(.4)}
.lock b{display:block;font-size:14px;color:var(--dim)}
.lock .d{font-size:11.5px;color:#6f675a;margin-top:3px;line-height:1.6}
.lock .chip{margin-left:auto;flex:none}
</style>
<script src="data.js"></script>
<script src="state.js"></script>
<body>
<script>document.body.insertAdjacentHTML('afterbegin', RH.ui.topbar('account'));</script>

<div class="wrap">
  <h1>계정 — 리뷰어 수첩</h1>

  <div class="grid">
    <section class="panel">
      <h2>필명과 서명</h2>
      <div class="sigpad" id="sigpad">
        <div class="rule"></div>
        <canvas id="sigcv"></canvas>
      </div>
      <div class="whois" id="whois"></div>
    </section>

    <section class="panel">
      <h2>누적 통계</h2>
      <div class="stats" id="stats"></div>
    </section>
  </div>

  <section class="panel">
    <h2>시작 덱 — 12장</h2>
    <table>
      <thead><tr><th>#</th><th>카드</th><th>계열</th><th>비용(필력)</th></tr></thead>
      <tbody id="deck"></tbody>
    </table>
  </section>

  <section class="panel lock">
    <span class="ico">🔒</span>
    <div>
      <b>카드 해금 트리</b>
      <div class="d">명성(RP)으로 새 카드를 사들여 이후 원정의 등장 풀에 넣는 성장 트리가 이 자리에 들어옵니다.</div>
    </div>
    <span class="chip">Layer 1.5 예정</span>
  </section>
</div>

<script>
(() => {
  const esc = RH.ui.esc;

  // ── 서명 — box[660,236] 좌표계를 canvas 에 비율 렌더 ─────────
  // 주의: signature.html 은 점을 [x,y] 배열로 저장한다 (CONTRACT 의 {x,y} 표기와 다름) — 둘 다 받는다
  const px = (p) => (Array.isArray(p) ? p[0] : p.x);
  const py = (p) => (Array.isArray(p) ? p[1] : p.y);

  function drawSig() {
    const sig = RH.sig();
    const pad = document.getElementById('sigpad');
    const cv = document.getElementById('sigcv');
    if (!sig || !sig.strokes || !sig.strokes.length) {
      cv.remove();
      pad.insertAdjacentHTML('beforeend',
        '<div class="nosig">서명 없음<br>새 원정의 리뷰어 등록에서 서명을 만듭니다.</div>');
      return;
    }
    const [bw, bh] = sig.box || [660, 236];
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 360, h = cv.clientHeight || 129;
    cv.width = w * dpr; cv.height = h * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale((w * dpr) / bw, (h * dpr) / bh);   // 저장 좌표계 → 캔버스 비율
    ctx.strokeStyle = '#2b2119'; ctx.lineWidth = 3;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // 등록부와 같은 중점 이차 베지어 — 저장된 획을 같은 모양으로 되그린다
    for (const s of sig.strokes) {
      if (!s.length) continue;
      ctx.beginPath();
      ctx.moveTo(px(s[0]), py(s[0]));
      if (s.length < 2) { ctx.lineTo(px(s[0]) + 0.1, py(s[0])); }
      for (let i = 1; i < s.length - 1; i++) {
        const x = px(s[i]), y = py(s[i]);
        ctx.quadraticCurveTo(x, y, (x + px(s[i + 1])) / 2, (y + py(s[i + 1])) / 2);
      }
      if (s.length >= 2) { const l = s[s.length - 1]; ctx.lineTo(px(l), py(l)); }
      ctx.stroke();
    }
  }
  drawSig();

  const pen = RH.penname();
  document.getElementById('whois').innerHTML = pen
    ? `<b>✍ ${esc(pen)}</b><span>님의 만물대장</span>`
    : `<b>✍ 미등록</b><span>새 원정을 시작하면 리뷰어 등록부터 진행합니다</span>`;

  // ── 누적 통계 ───────────────────────────────────────────
  const m = RH.meta();
  const tiles = [
    ['원정 횟수', m.runs, '회'],
    ['클리어', m.wins, '회'],
    ['최고 도달 층', m.bestFloor ? `1막 ${m.bestFloor}` : '—', m.bestFloor ? '층' : ''],
    ['명성', m.rp, 'RP'],
    ['적립금', m.p, 'P'],
    ['원정대 기록', m.expedition.length, '건'],
  ];
  document.getElementById('stats').innerHTML = tiles.map(([k, v, u]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`).join('');

  // ── 시작 덱 12장 ────────────────────────────────────────
  const KIND = { prefix: '접두 · 수식', suffix: '접미 · 서술', special: '특수' };
  const byId = Object.fromEntries(RH_DATA.cards.map((c) => [c.id, c]));
  document.getElementById('deck').innerHTML = RH_DATA.startingDeck.map((id, i) => {
    const c = byId[id];
    if (!c) return `<tr><td class="no">${i + 1}</td><td colspan="3">알 수 없는 카드 ${esc(id)}</td></tr>`;
    return `<tr>
      <td class="no">${i + 1}</td>
      <td><span class="nm">${esc(c.name)}</span> <span class="kind">${KIND[c.kind] || c.kind}</span></td>
      <td>${c.suit ? `<span class="suit">${esc(c.suit)}</span>` : '<span class="tiny">—</span>'}</td>
      <td class="cost">✍ ${c.cost}</td>
    </tr>`;
  }).join('');
})();
</script>
<script src="debug.js"></script>
</body>
