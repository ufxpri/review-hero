<meta charset="utf-8">
<title>이세계 리뷰용사 — 1막 지도</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ── 던전 상가 층별 안내도 — 아래(1층)에서 위(6층 지배인실)로 올라간다 ── */
.wrap{max-width:920px;margin:0 auto;padding:22px 16px 60px}

/* 상단 요약 — 백화점 안내데스크 간판 느낌 */
.deskhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  border:1px solid var(--edge-hi);border-radius:8px;padding:14px 18px;margin-bottom:6px;
  background:linear-gradient(rgba(232,220,192,.07),rgba(232,220,192,.02)),var(--panel)}
.deskhead .title{display:flex;flex-direction:column;gap:3px}
.deskhead .title b{font-size:19px;color:var(--gold);letter-spacing:-.4px}
.deskhead .title span{font-size:11px;color:var(--dim);letter-spacing:.5px}
.deskhead .stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.deskhead .stat{display:flex;align-items:center;gap:6px;border:1px solid var(--edge);
  border-radius:5px;padding:6px 12px;background:rgba(0,0,0,.35);
  font-size:14px;font-variant-numeric:tabular-nums}
.deskhead .stat b{font-size:16px;color:var(--ink)}
.deskhead .stat .lb{font-size:11px;color:var(--dim)}
.notice{font-size:11px;color:var(--dim);text-align:center;margin:8px 0 18px;letter-spacing:.3px}

/* 층 한 줄 */
.floor{display:flex;gap:14px;align-items:stretch;border:1px solid var(--edge);
  border-radius:8px;padding:12px 14px;background:var(--panel);position:relative}
.floor .fno{flex:none;width:96px;display:flex;flex-direction:column;justify-content:center;
  gap:4px;border-right:1px dashed var(--edge);padding-right:12px}
.floor .fno b{font-size:22px;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.floor .fno span{font-size:10.5px;color:var(--dim);line-height:1.35}
.floor .nodes{display:flex;gap:10px;flex:1;align-items:stretch}

/* 층 상태 3종 — 지나온 층 / 현재 층 / 잠긴 층 */
.floor.past{opacity:.5}
.floor.past .fno b{color:var(--dim)}
.floor.locked{opacity:.65;filter:grayscale(.55)}
.floor.current{border-color:var(--gold);
  box-shadow:0 0 0 1px rgba(224,169,75,.35),0 0 26px rgba(224,169,75,.14)}
.floor.current .fno b{color:var(--gold)}
.heremark{position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  background:var(--gold);color:#1c1408;font-size:10.5px;font-weight:800;border-radius:4px;
  padding:3px 7px;letter-spacing:.3px;box-shadow:0 2px 10px rgba(0,0,0,.6);
  writing-mode:vertical-rl;text-orientation:upright}

/* 층 사이 연결선 — 안내도의 에스컬레이터 표시 흉내 */
.link{height:26px;display:flex;justify-content:center;align-items:center;gap:44px}
.link i{display:block;width:1px;height:100%;background:var(--edge)}
.link i.mid{background:var(--edge-hi)}
.link.done i{opacity:.35}

/* 노드 카드 = 상품 목록 한 칸 */
.node{flex:1;min-width:0;border:1px solid var(--edge);border-radius:6px;padding:9px 11px;
  background:linear-gradient(rgba(232,220,192,.06),rgba(232,220,192,.015)),var(--slab);
  display:flex;flex-direction:column;gap:5px;position:relative;text-align:left;
  color:var(--ink);font:inherit}
.node .head{display:flex;align-items:center;gap:7px}
.node .ico{font-size:17px}
.node .ty{font-size:12px;font-weight:800;letter-spacing:-.2px}
.node .badge{margin-left:auto;font-size:10px;border:1px solid var(--edge);border-radius:3px;
  padding:1px 6px;color:var(--dim);background:rgba(0,0,0,.3)}
.node .prod{display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--edge);
  padding-top:5px}
.node .nm{font-size:12.5px;font-weight:700;line-height:1.3}
.node .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.node .meta .stars{font-size:12px}
.node .desc{font-size:11px;color:var(--dim);line-height:1.45;border-top:1px dashed var(--edge);
  padding-top:5px}

/* 클릭 가능(현재 층) */
button.node{cursor:pointer}
button.node:hover{border-color:var(--gold);transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 1px rgba(224,169,75,.5);
  transition:transform .1s,box-shadow .1s}
button.node:hover .enter{opacity:1}
.enter{position:absolute;right:9px;bottom:8px;font-size:10.5px;font-weight:800;
  color:var(--gold);opacity:.55}
.node.done{opacity:.55}
.node.done .badge{color:var(--green);border-color:var(--green)}
.node.lockcard .badge{color:var(--dim)}

/* 6층 보스 칸 — 지배인실 */
.floor.bossfloor{background:linear-gradient(rgba(194,69,46,.08),rgba(0,0,0,0)),var(--panel)}
.floor.bossfloor .fno span{color:#e08b72}
.node.boss{border-color:#7a3a2c;background:linear-gradient(rgba(194,69,46,.12),rgba(0,0,0,.1)),var(--slab)}
.node.boss .ty{color:#e08b72}
.node.boss .nm{font-size:14px;color:#f0c9a0}
button.node.boss:hover{border-color:var(--red);
  box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 1px rgba(194,69,46,.6)}

/* 런 없음 폴백 */
.norun{max-width:460px;margin:110px auto 0;text-align:center;display:flex;
  flex-direction:column;gap:14px;padding:30px 26px}
.norun .ico{font-size:40px}
.norun h2{font-size:17px}
.norun p{font-size:12.5px;color:var(--dim);line-height:1.6}
.norun .btns{display:flex;gap:10px;justify-content:center;margin-top:6px}
</style>
<script src="data.js"></script>
<script src="state.js"></script>
<body>
<script>
document.body.insertAdjacentHTML('afterbegin', RH.ui.topbar('map'));

// 개발용: ?debugrun=1 이면 런이 없을 때 자동 생성한다 (스크린샷 검증용 — 출시 전 제거)
if (new URLSearchParams(location.search).get('debugrun') === '1' && !RH.run()) {
  RH.newRun(42);
}

const run = RH.run();
const esc = RH.ui.esc;

if (!run) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="norun panel">
      <div class="ico">🗺️</div>
      <h2>진행 중인 원정이 없습니다</h2>
      <p>던전 상가는 원정 중에만 입장할 수 있습니다.<br>
         새 원정을 시작하면 1막 안내도가 발급됩니다.</p>
      <div class="btns">
        <button class="btn primary" id="btnNew">새 원정 시작</button>
        <a class="btn ghost" href="index.html">메인으로</a>
      </div>
    </div>`);
  document.getElementById('btnNew').addEventListener('click', () => {
    RH.newRun();
    location.reload();
  });
} else {
  renderMap(run);
}

function renderMap(run) {
  const EN = Object.fromEntries(RH_DATA.enemies.map((e) => [e.id, e]));
  // 상품 별점 — 노드 종류 기준(위험할수록 「프리미엄」). E03 처럼 정예급 적이
  // 일반 전투 풀에 섞여 나와도 노드 표기는 일관되게 유지한다.
  const TYPE_STARS = { battle: 2, elite: 3, boss: 5 };
  const FLOOR_DESC = {
    1: '입점 매장', 2: '전문 매장', 3: '전문 매장', 4: '전문 매장',
    5: '휴게·편의 시설', 6: '지배인실 — 관계자 외 출입 금지',
  };
  const NODE_DESC = {
    event: '무슨 일이 벌어질지 모르는 매장입니다.',
    shop: '리뷰용사 전용 취급점. 카드·소모품 판매.',
    rest: '휴게 공간 — 의지를 회복할 수 있습니다.',
  };

  const nodeCard = (node, floorState) => {
    const isCombat = node.type === 'battle' || node.type === 'elite' || node.type === 'boss';
    const enemy = isCombat ? EN[node.enemy] : null;
    const clickable = floorState === 'current';
    const tag = clickable ? 'button' : 'div';

    let badge = '';
    if (floorState === 'past') badge = node.visited ? '이용 완료' : '지나침';
    if (floorState === 'locked') badge = '🔒 준비 중';
    if (floorState === 'current') badge = '영업 중';

    let body = '';
    if (enemy) {
      body = `<div class="prod">
        <div class="nm">${esc(enemy.name)}</div>
        <div class="meta">${RH.ui.stars(TYPE_STARS[node.type] ?? 2)}
          <span>🧠 의지 ${enemy.will}</span></div>
      </div>`;
    } else {
      body = `<div class="desc">${esc(NODE_DESC[node.type] || '')}</div>`;
    }

    const cls = ['node', node.type === 'boss' ? 'boss' : '',
      floorState === 'past' && node.visited ? 'done' : '',
      floorState === 'locked' ? 'lockcard' : ''].filter(Boolean).join(' ');

    return `<${tag} class="${cls}" ${clickable ? `data-node="${node.id}"` : ''}>
      <div class="head"><span class="ico">${RH.NODE_ICON[node.type]}</span>
        <span class="ty">${RH.NODE_LABEL[node.type]}</span>
        ${badge ? `<span class="badge">${badge}</span>` : ''}</div>
      ${body}
      ${clickable ? '<span class="enter">입장 ▸</span>' : ''}
    </${tag}>`;
  };

  // 위(6층)부터 아래(1층)로 쌓는다 — 안내도처럼 위층이 위에 온다
  const rows = [];
  for (let f = 6; f >= 1; f--) {
    const nodes = run.map.floors[f - 1] || [];
    const state = f < run.floor ? 'past' : f === run.floor ? 'current' : 'locked';
    rows.push(`<div class="floor ${state} ${f === 6 ? 'bossfloor' : ''}" data-floor="${f}">
      ${state === 'current' ? '<span class="heremark">현재위치</span>' : ''}
      <div class="fno"><b>${f}F</b><span>${FLOOR_DESC[f]}</span></div>
      <div class="nodes">${nodes.map((n) => nodeCard(n, state)).join('')}</div>
    </div>`);
    if (f > 1) rows.push(`<div class="link ${f <= run.floor ? '' : 'done'}"><i></i><i class="mid"></i><i></i></div>`);
  }

  document.body.insertAdjacentHTML('beforeend', `
    <div class="wrap">
      <div class="deskhead panel">
        <div class="title"><b>던전 상가 층별 안내도</b>
          <span>1막 — DUNGEON MALL FLOOR GUIDE</span></div>
        <div class="stats">
          <span class="stat"><span class="lb">현재</span><b>1막 ${run.floor}층</b></span>
          <span class="stat">🧠<b>${run.will}</b><span class="lb">/ ${run.maxWill} 의지</span></span>
          <span class="stat">🪙<b>${run.gold}</b><span class="lb">골드</span></span>
          <span class="stat">🃏<b>${run.deck.length}</b><span class="lb">장</span></span>
        </div>
      </div>
      <p class="notice">※ 현재 층의 매장 한 곳을 골라 입장하십시오. 입장 후에는 되돌아올 수 없습니다.
        불만 사항은 리뷰(좋아요 감점)로 남겨 주십시오.</p>
      ${rows.join('')}
    </div>`);

  document.querySelectorAll('button.node[data-node]').forEach((el) => {
    el.addEventListener('click', () => RH.enterNode(el.dataset.node));
  });

  // 현재 층이 화면에 들어오게 스크롤 (6층이 위라 초반 런은 아래쪽에 있다).
  // 리로드 시 브라우저의 스크롤 복원이 위치를 되돌리므로 load 후 한 번 더 잡는다.
  history.scrollRestoration = 'manual';
  const cur = document.querySelector('.floor.current');
  if (cur) {
    const focusCur = () => cur.scrollIntoView({ block: 'center' });
    focusCur();
    window.addEventListener('load', () => requestAnimationFrame(focusCur));
  }
}
</script>
<script src="debug.js"></script>
</body>
