<meta charset="utf-8">
<title>이세계 리뷰용사 — 배송 조회</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ── 지도 = 배송 조회 화면 (ADR-024) ──────────────────────────────
   운송장 하나를 조회한 화면이다. 노드가 경유지, 간선이 배송 경로,
   현재 위치가 트럭, 최종 목적지가 6층 지배인실. 아래(집화)에서 위(인수)로 간다. */
body{
  background:
    linear-gradient(rgba(18,16,14,.90),rgba(10,9,8,.94)),
    url("../assets/map-dispatch.png") center/cover no-repeat fixed,
    var(--bg);
}
.wrap{max-width:1060px;margin:0 auto;padding:14px 16px 24px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums}

/* ── 운송장 = 종이 한 장 ───────────────────────────────────
   여기만 색이 뒤집힌다. 화면 전체는 어두운 던전인데 이 블록은 실제로 손에 들린
   물류 용지라서, 배경이 종이 텍스처(T01)이고 글자는 잉크다. */
.waybill{
  --wb-ink:#232a35;          /* 도트프린터 리본 잉크 — 검정에 남색이 섞인다 */
  --wb-dim:#6d6353;          /* 인쇄 서식의 항목명 */
  --wb-line:rgba(72,56,34,.38);
  --wb-red:#a8321f;
  position:relative;border:0;border-radius:2px;padding:0;overflow:hidden;color:var(--wb-ink);
  background:
    /* 카본지 얼룩 두 점 — 종이 위에서만 보이는 한랭 얼룩 */
    radial-gradient(46% 78% at 87% 12%,rgba(116,110,140,.13),transparent 62%),
    radial-gradient(38% 70% at 16% 94%,rgba(116,110,140,.11),transparent 66%),
    url("../assets/paper-waybill.png") center/cover no-repeat,
    #e0d4b2;
  box-shadow:inset 0 1px 0 rgba(255,252,240,.4),inset 0 -1px 0 rgba(92,72,42,.28),
    0 14px 34px rgba(0,0,0,.62),0 2px 5px rgba(0,0,0,.45)}
/* 천공 — 연속 용지의 스프로킷 구멍. 좌우 세로 띠 */
.waybill::before,.waybill::after{content:'';position:absolute;top:0;bottom:0;width:16px;
  background-image:
    radial-gradient(circle at 50% 50%,rgba(46,36,20,.55) 0 2.3px,
      rgba(255,250,236,.5) 2.7px 3.5px,transparent 3.7px);
  background-size:16px 18px;background-repeat:repeat-y;pointer-events:none;z-index:2}
.waybill::before{left:0;border-right:1px dashed var(--wb-line)}
.waybill::after{right:0;border-left:1px dashed var(--wb-line)}

.wb-top{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;padding:12px 26px 11px;
  border-bottom:1px dashed var(--wb-line)}
.wb-id .lb{font-size:10px;color:var(--wb-dim);letter-spacing:1.4px;display:block;margin-bottom:3px}
.wb-id b{font-size:23px;color:var(--wb-ink);letter-spacing:1px;line-height:1.05;display:block}
.wb-id .code{height:19px;width:172px;margin:5px 0 4px;opacity:.66;
  background:repeating-linear-gradient(90deg,var(--wb-ink) 0 2px,transparent 2px 4px,
    var(--wb-ink) 4px 5px,transparent 5px 9px,var(--wb-ink) 9px 12px,transparent 12px 14px)}
.wb-id .sub{font-size:10.5px;color:var(--wb-dim);letter-spacing:.4px}
.wb-state{margin-left:auto;display:flex;align-items:center;gap:14px}
.wb-state .now{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.wb-state .now b{font-size:15px;color:var(--wb-ink);letter-spacing:-.2px}
.wb-state .now span{font-size:10.5px;color:var(--wb-dim)}
/* 도장 — 붉은 잉크가 번진 고무 도장. 사람이 찍은 것이니 기울어 있다 */
.seal{position:relative;border:2px solid rgba(168,50,31,.72);color:var(--wb-red);
  border-radius:3px;padding:6px 10px;font-size:11.5px;font-weight:800;letter-spacing:1.5px;
  line-height:1.2;text-align:center;transform:rotate(-8.5deg);opacity:.88;
  mix-blend-mode:multiply;filter:blur(.22px);
  text-shadow:0 0 2.5px rgba(168,50,31,.55);
  box-shadow:inset 0 0 0 1px rgba(168,50,31,.2);
  background:
    radial-gradient(58% 66% at 26% 28%,rgba(168,50,31,.14),transparent 72%),
    radial-gradient(64% 74% at 82% 78%,rgba(168,50,31,.11),transparent 70%)}

.wb-grid{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px dashed var(--wb-line)}
.wb-cell{padding:9px 16px;border-right:1px dashed var(--wb-line);min-width:0}
.wb-cell:first-child{padding-left:26px}
.wb-cell:last-child{border-right:0;padding-right:26px}
.wb-cell .k{font-size:10px;color:var(--wb-dim);letter-spacing:1px;margin-bottom:3px}
.wb-cell .v{font-size:12.5px;color:var(--wb-ink);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb-cell .v em{font-style:normal;font-weight:800;color:#151b26}
.wb-cell .v2{font-size:10.5px;color:var(--wb-dim);margin-top:2px}

/* 진행 단계 띠 — 배송 조회의 그 막대. 종이 위이므로 잉크 두 색으로만 찍는다 */
.steps{display:flex;align-items:stretch;padding:9px 26px 11px;gap:0}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;
  font-size:10px;color:#6f6552;letter-spacing:-.2px}
.step::before{content:'';position:absolute;top:5px;left:-50%;width:100%;height:1px;
  background:rgba(72,56,34,.3)}
.step:first-child::before{display:none}
.step i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(60,48,30,.5);
  background:rgba(255,250,236,.35);position:relative;z-index:1;font-style:normal;font-size:8px;
  line-height:9px;text-align:center;color:transparent}
.step.past{color:#4b4536}
.step.past i{background:var(--wb-ink);border-color:var(--wb-ink);color:#e8dcc0}
.step.past::before{background:rgba(60,48,30,.6)}
.step.on{color:var(--wb-red);font-weight:800}
.step.on i{background:var(--wb-red);border-color:var(--wb-red);
  box-shadow:0 0 0 3px rgba(168,50,31,.18)}
.step.on::before{background:rgba(60,48,30,.6)}

/* 서사 한 줄 — 매번 읽히는 자리라 짧게 (worldview §5.3 간결한 평서체) */
.leak{display:flex;align-items:center;gap:10px;margin:9px 2px 12px;flex-wrap:wrap}
.leak p{font-size:12px;color:#b5a68c;line-height:1.5;letter-spacing:-.2px}
.leak .tag{margin-left:auto;font-size:10px;color:var(--dim);border:1px solid var(--edge);
  border-radius:3px;padding:2px 7px;background:rgba(0,0,0,.35);white-space:nowrap}

/* ── 경로 그래프 ─────────────────────────────────────────── */
.route{position:relative}
.route svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;
  overflow:visible}
.route .row{position:relative;z-index:1;display:flex;align-items:stretch;gap:12px;
  padding:0 0 15px}
.route .row:last-child{padding-bottom:0}
.gut{flex:none;width:112px;display:flex;flex-direction:column;justify-content:center;gap:2px;
  padding-right:10px;text-align:right}
.gut b{font-size:15px;color:var(--dim);letter-spacing:-.3px}
.gut span{font-size:10.5px;color:#6f6656;line-height:1.3}
.row.here .gut b{color:var(--gold)}
.row.here .gut span{color:#b5a68c}
/* .row.here .gut span 규칙에 잡히지 않도록 태그를 달리한다 (i.truck) */
.gut i.truck{display:block;font-style:normal;margin-top:5px;font-size:10px;font-weight:800;color:#1c1408;
  background:var(--gold);border-radius:4px;padding:3px 4px;letter-spacing:-.3px;
  text-align:center;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.55)}
.nodes{flex:1;display:flex;gap:12px;min-width:0}

/* 경유지 카드 */
.node{flex:1;min-width:0;border:1px solid var(--edge);border-radius:6px;padding:8px 11px;
  background:linear-gradient(rgba(232,220,192,.05),rgba(232,220,192,.01)),var(--slab);
  display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink);font:inherit;
  position:relative}
.node .head{display:flex;align-items:center;gap:6px}
.node .ico{font-size:14px}
.node .ty{font-size:11.5px;font-weight:800;letter-spacing:-.2px}
.node .badge{margin-left:auto;font-size:9.5px;border:1px solid var(--edge);border-radius:3px;
  padding:1px 5px;color:var(--dim);background:rgba(0,0,0,.35);white-space:nowrap}
.node .nm{font-size:12.5px;font-weight:700;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .meta{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim)}
.node .meta .stars{font-size:11px;letter-spacing:.5px}
.node .desc{font-size:10.5px;color:var(--dim);line-height:1.4}

.node.done{border-color:#4d6b50;background:rgba(79,154,94,.07)}
.node.done .badge{color:var(--green);border-color:#4d6b50}
.node.miss{opacity:.32}
.node.ahead{opacity:.55;filter:grayscale(.4)}
button.node{cursor:pointer;border-color:var(--edge-hi);
  background:linear-gradient(rgba(224,169,75,.10),rgba(224,169,75,.02)),var(--slab);
  box-shadow:0 0 0 1px rgba(224,169,75,.18),0 6px 22px rgba(0,0,0,.45)}
button.node .badge{color:var(--gold);border-color:var(--edge-hi)}
button.node:hover{border-color:var(--gold);transform:translateY(-2px);
  box-shadow:0 0 0 1px rgba(224,169,75,.55),0 9px 26px rgba(0,0,0,.6)}
button.node:hover .enter{opacity:1}
.enter{position:absolute;right:9px;bottom:7px;font-size:10px;font-weight:800;
  color:var(--gold);opacity:.5}

/* 최종 목적지 — 6층 지배인실은 늘 보인다 */
.row.dest .node{border-color:#7a3a2c;
  background:linear-gradient(rgba(194,69,46,.13),rgba(0,0,0,.1)),var(--slab)}
.row.dest .node .ty{color:#e08b72}
.row.dest .node .nm{font-size:13.5px;color:#f0c9a0}
.row.dest button.node:hover{border-color:var(--red);
  box-shadow:0 0 0 1px rgba(194,69,46,.6),0 9px 26px rgba(0,0,0,.6)}
.row.dest .gut b{color:#e08b72}

/* 출발지 표식 */
.origin{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin-top:2px}
.origin .gut{padding-right:10px}
.origin .pin{width:9px;height:9px;border-radius:50%;background:var(--edge-hi);
  box-shadow:0 0 0 3px rgba(195,154,82,.18)}
.origin .txt{font-size:10.5px;color:var(--dim)}

/* 간선 */
.route path{fill:none;stroke-linecap:round}
.route path.e-done{stroke:#c39a52;stroke-width:2}
.route path.e-active{stroke:var(--gold);stroke-width:2.4;
  filter:drop-shadow(0 0 5px rgba(224,169,75,.5))}
.route path.e-ahead{stroke:#5b5041;stroke-width:1.3;stroke-dasharray:4 5}
.route path.e-miss{stroke:#3d372d;stroke-width:1;stroke-dasharray:2 6}

/* ── 발급 연출 — 런당 첫 지도 방문 1회 (ADR-024 ②) ──────────
   택배좌는 얼굴을 보이지 않는다. 카운터 너머 장갑 낀 손까지만이다(3막 반전 보호). */
.issue{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;cursor:pointer;
  background:#070605;animation:iss-in .3s ease both}
.issue.out{animation:iss-out .42s ease both;pointer-events:none}
@keyframes iss-in{from{opacity:0}to{opacity:1}}
@keyframes iss-out{from{opacity:1}to{opacity:0}}
.issue .plate{position:absolute;inset:0;background:url("../assets/issue-hand.png") center/cover no-repeat;
  opacity:.72}
.issue .vig{position:absolute;inset:0;
  background:radial-gradient(86% 70% at 46% 52%,rgba(7,6,5,0),rgba(7,6,5,.78) 82%)}

/* 건네받는 종이 — 운송장 본문과 같은 텍스처를 쓴다 */
.slip{position:relative;z-index:1;width:376px;padding:16px 20px 15px;border-radius:2px;
  color:#232a35;text-align:left;
  background:url("../assets/paper-waybill.png") center/cover no-repeat,#e0d4b2;
  box-shadow:0 22px 50px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,252,240,.4);
  animation:slip-in .85s cubic-bezier(.16,.9,.28,1) .35s both}
@keyframes slip-in{
  from{opacity:0;transform:translate(-58vw,64px) rotate(-15deg) scale(.62)}
  to  {opacity:1;transform:translate(0,0) rotate(-1.6deg) scale(1)}}
.slip .lb{font-size:9.5px;letter-spacing:1.6px;color:#6d6353}
.slip b{display:block;font-size:20px;letter-spacing:1px;margin-top:2px}
.slip .code{height:16px;margin:7px 0 6px;opacity:.66;
  background:repeating-linear-gradient(90deg,#232a35 0 2px,transparent 2px 4px,
    #232a35 4px 5px,transparent 5px 9px,#232a35 9px 12px,transparent 12px 14px)}
.slip .to{font-size:11px;color:#4b4536;border-top:1px dashed rgba(72,56,34,.38);
  padding:6px 84px 0 0;line-height:1.45}
/* 도장은 종이 안에 완전히 들어와야 한다 — multiply 라 종이 밖으로 나가면 검게 죽는다 */
.slip .seal{position:absolute;right:14px;bottom:11px;font-size:12.5px;padding:7px 11px;
  animation:seal-hit .26s cubic-bezier(.2,1.5,.4,1) 1.9s both}
@keyframes seal-hit{
  from{opacity:0;transform:rotate(-8.5deg) scale(2.7)}
  60% {opacity:.95;transform:rotate(-8.5deg) scale(.94)}
  to  {opacity:.88;transform:rotate(-8.5deg) scale(1)}}
.slip.hit{animation:slip-in .85s cubic-bezier(.16,.9,.28,1) .35s both,
  slip-shake .18s ease 1.92s both}
@keyframes slip-shake{0%{transform:translate(0,0) rotate(-1.6deg)}
  40%{transform:translate(0,3px) rotate(-2.4deg)}
  100%{transform:translate(0,0) rotate(-1.6deg)}}

.issue .lines{position:relative;z-index:1;width:min(560px,86vw);display:flex;
  flex-direction:column;gap:9px;text-align:center}
.issue .lines p{font-size:13.5px;line-height:1.6;color:#c8bda6;letter-spacing:-.2px;
  opacity:0;animation:line-up .45s ease both}
.issue .lines p.say{color:#efe7d8}
.issue .lines p.say b{color:#9fb2c8;font-weight:700;margin-right:8px;letter-spacing:.6px}
.issue .lines p:nth-child(1){animation-delay:1.3s}
.issue .lines p:nth-child(2){animation-delay:2.3s}
.issue .lines p:nth-child(3){animation-delay:3.1s}
@keyframes line-up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.issue .skip{position:absolute;bottom:22px;z-index:1;font-size:10.5px;color:#6f6656;
  letter-spacing:.6px}
@media (prefers-reduced-motion:reduce){
  .issue,.issue.out,.slip,.slip.hit,.slip .seal,.issue .lines p{animation-duration:.01s !important;
    animation-delay:0s !important}
}

/* 런 없음 폴백 */
.norun{max-width:470px;margin:100px auto 0;text-align:center;display:flex;
  flex-direction:column;gap:14px;padding:30px 26px}
.norun .ico{font-size:38px}
.norun h2{font-size:17px}
.norun p{font-size:12.5px;color:var(--dim);line-height:1.65}
.norun .btns{display:flex;gap:10px;justify-content:center;margin-top:6px}
</style>
<script src="data.js"></script>
<script src="state.js"></script>
<body>
<script>
document.body.insertAdjacentHTML('afterbegin', RH.ui.topbar('map'));

// 개발용: ?debugrun=1 이면 런이 없을 때 자동 생성한다 (스크린샷 검증용 — 출시 전 제거)
if (new URLSearchParams(location.search).get('debugrun') === '1' && !RH.run()) {
  RH.newRun(42);
}

const run = RH.run();
const esc = RH.ui.esc;

if (!run) {
  document.body.insertAdjacentHTML('beforeend', `
    <div class="norun panel">
      <div class="ico">📦</div>
      <h2>조회할 운송장이 없습니다</h2>
      <p>배송 조회는 원정 중에만 열람할 수 있습니다.<br>
         새 원정을 시작하면 1막 운송장이 발급됩니다.</p>
      <div class="btns">
        <button class="btn primary" id="btnNew">새 원정 시작</button>
        <a class="btn ghost" href="index.html">메인으로</a>
      </div>
    </div>`);
  document.getElementById('btnNew').addEventListener('click', () => {
    RH.newRun();
    location.reload();
  });
} else {
  renderTracking(run);
}

function renderTracking(run) {
  const EN = Object.fromEntries(RH_DATA.enemies.map((e) => [e.id, e]));
  // 상품 별점 — 노드 종류 기준(위험할수록 「프리미엄」). E03 처럼 정예급 적이
  // 일반 전투 풀에 섞여 나와도 노드 표기는 일관되게 유지한다.
  const TYPE_STARS = { battle: 2, elite: 3, boss: 5 };
  // 층 = 배송 단계. 물류 용어로 읽히게 두되 층 번호를 지우지는 않는다.
  const STAGE = ['집화 처리', '간선 상차', '중간 분류', '간선 하차', '배송 준비', '인수 예정'];
  const STAGE_SUB = { 6: '지배인실' };
  const NODE_DESC = {
    event: '확인되지 않은 취급 구간',
    shop: '취급점 — 카드·소모품',
    rest: '휴게 시설 — 의지 회복',
  };

  const floors = run.map.floors;
  const visitedOf = (f) => (floors[f - 1] || []).find((n) => n.visited) || null;
  const orderNo = `RH-${run.act}A-${String(run.seed % 10000).padStart(4, '0')}`;
  const statusNow = run.floor >= 6 ? '배송지 도착' : '배송 중';
  const statusSub = `1막 ${run.floor}/6 구간 · ${STAGE[run.floor - 1]}`;

  // ── 운송장 ──
  const stepsHtml = STAGE.map((s, i) => {
    const f = i + 1;
    const cls = f < run.floor ? 'past' : f === run.floor ? 'on' : '';
    return `<div class="step ${cls}"><i>${f < run.floor ? '✓' : ''}</i><span>${f}F ${s}</span></div>`;
  }).join('');

  const waybill = `
    <div class="waybill">
      <div class="wb-top">
        <div class="wb-id">
          <span class="lb">운송장 번호</span>
          <b class="mono">${orderNo}</b>
          <div class="code" aria-hidden="true"></div>
          <span class="sub">만물마켓 물류 · 1막 구간 조회</span>
        </div>
        <div class="wb-state">
          <div class="now"><b>${statusNow}</b><span>${esc(statusSub)}</span></div>
          <div class="seal">무단<br>조회</div>
        </div>
      </div>
      <div class="wb-grid">
        <div class="wb-cell"><div class="k">보내는 사람</div>
          <div class="v">발송인 미표기</div>
          <div class="v2">물류 담당 직인만 찍혀 있다</div></div>
        <div class="wb-cell"><div class="k">받는 사람</div>
          <div class="v"><em>본사 직영 · 답글 없는 사장</em></div>
          <div class="v2">6F 지배인실 — 관계자 외 출입 금지</div></div>
        <div class="wb-cell"><div class="k">품목</div>
          <div class="v">보급품 · 내용 미상</div>
          <div class="v2">파손 주의 · 개봉 시 반품 불가</div></div>
        <div class="wb-cell"><div class="k">조회자</div>
          <div class="v">${esc(RH.penname() || '미등록')}</div>
          <div class="v2">의지 ${run.will}/${run.maxWill} · 소지금 ${run.gold} · 카드 ${run.deck.length}장</div></div>
      </div>
      <div class="steps">${stepsHtml}</div>
    </div>
    <div class="leak">
      <p>이 경로를 흘린 것은 물류 담당이다. 남의 운송장이고, 나는 이 택배와 같은 길로 6층까지 올라간다.</p>
      <span class="tag">열람 기록 남지 않음</span>
    </div>`;

  // ── 경유지 카드 ──
  const nodeCard = (node, state) => {
    const enemy = EN[node.enemy];
    const clickable = state === 'sel';
    const tag = clickable ? 'button' : 'div';
    const badge = { done: '통과 ✓', miss: '미경유', ahead: '예정', sel: '선택 가능' }[state];

    const body = enemy
      ? `<div class="nm">${esc(enemy.name)}</div>
         <div class="meta">${RH.ui.stars(TYPE_STARS[node.type] ?? 2)}
           <span>🧠 의지 ${enemy.will}</span></div>`
      : `<div class="desc">${esc(NODE_DESC[node.type] || '')}</div>`;

    return `<${tag} class="node ${state}" data-nid="${node.id}"
        ${clickable ? `data-go="${node.id}"` : ''}>
      <div class="head"><span class="ico">${RH.NODE_ICON[node.type]}</span>
        <span class="ty">${RH.NODE_LABEL[node.type]}</span>
        <span class="badge">${badge}</span></div>
      ${body}
      ${clickable ? '<span class="enter">경유 ▸</span>' : ''}
    </${tag}>`;
  };

  // 위(6F 목적지)에서 아래(1F 집화)로 쌓는다 — 조회 화면은 최신 단계가 위다
  const open = RH.reachable(run); // 직전 경유지에서 이어지는 곳만 선택 가능 (ADR-024)
  const rows = [];
  for (let f = 6; f >= 1; f--) {
    const nodes = floors[f - 1] || [];
    const rowCls = ['row', f === run.floor ? 'here' : '', f === 6 ? 'dest' : ''].filter(Boolean).join(' ');
    const cards = nodes.map((n) => {
      let state;
      if (f < run.floor) state = n.visited ? 'done' : 'miss';
      else if (f === run.floor) state = open.includes(n.id) ? 'sel' : 'miss'; // 경로 밖은 못 간다
      else state = 'ahead';
      return nodeCard(n, state);
    }).join('');
    rows.push(`<div class="${rowCls}" data-floor="${f}">
      <div class="gut"><b>${f}F</b><span>${STAGE[f - 1]}${STAGE_SUB[f] ? `<br>${STAGE_SUB[f]}` : ''}</span>
        ${f === run.floor ? '<i class="truck">🚚 현재 위치</i>' : ''}</div>
      <div class="nodes">${cards}</div>
    </div>`);
  }

  document.body.insertAdjacentHTML('beforeend', `
    <div class="wrap">
      ${waybill}
      <div class="route" id="route">
        <svg id="edges" aria-hidden="true"></svg>
        ${rows.join('')}
        <div class="origin" id="origin">
          <div class="gut"><b style="font-size:11px">발송</b></div>
          <span class="pin"></span>
          <span class="txt">집화 접수 — 이 지점부터 추적이 시작된다</span>
        </div>
      </div>
    </div>`);

  document.querySelectorAll('button.node[data-go]').forEach((el) => {
    el.addEventListener('click', () => RH.enterNode(el.dataset.go));
  });

  // ── 간선(배송 경로) — DOM 배치를 측정해 SVG로 잇는다 ──
  const route = document.getElementById('route');
  const svg = document.getElementById('edges');
  const originPin = document.querySelector('#origin .pin');

  function drawEdges() {
    const box = route.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    const anchor = (el, side) => {
      const r = el.getBoundingClientRect();
      return { x: r.left - box.left + r.width / 2,
               y: (side === 'top' ? r.top : r.bottom) - box.top };
    };
    const nodeEl = (id) => route.querySelector(`.node[data-nid="${id}"]`);

    // 아래 층(from) → 위 층(to). f=0 은 출발지 표식.
    const paths = [];
    for (let f = 0; f <= 5; f++) {
      const froms = f === 0 ? [{ el: originPin, visited: true, next: null }]
        : (floors[f - 1] || []).map((n) => ({ el: nodeEl(n.id), visited: !!n.visited, next: n.next || null }));
      const tos = (floors[f] || []).map((n) => ({ el: nodeEl(n.id), visited: !!n.visited, id: n.id }));
      const toFloor = f + 1;
      for (const a of froms) {
        if (!a.el) continue;
        for (const b of tos) {
          if (!b.el) continue;
          // 실제 경로만 그린다 — next 가 없는 구 세이브는 전결합으로 폴백
          if (a.next && !a.next.includes(b.id)) continue;
          let cls;
          if (a.visited && b.visited) cls = 'e-done';
          else if (a.visited && toFloor === run.floor) cls = 'e-active';
          else if (toFloor > run.floor) cls = 'e-ahead';
          else cls = 'e-miss';
          const p1 = anchor(a.el, 'top');
          const p2 = anchor(b.el, 'bottom');
          const dy = Math.abs(p1.y - p2.y) * 0.55;
          paths.push(`<path class="${cls}" d="M${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`
            + ` C${p1.x.toFixed(1)} ${(p1.y - dy).toFixed(1)},`
            + ` ${p2.x.toFixed(1)} ${(p2.y + dy).toFixed(1)},`
            + ` ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}"/>`);
        }
      }
    }
    // 이미 지나온 경로가 위에 오도록 순서를 잡는다
    const order = { 'e-miss': 0, 'e-ahead': 1, 'e-done': 2, 'e-active': 3 };
    paths.sort((x, y) => order[x.match(/e-\w+/)[0]] - order[y.match(/e-\w+/)[0]]);
    svg.innerHTML = paths.join('');
  }

  drawEdges();
  window.addEventListener('load', drawEdges);
  window.addEventListener('resize', drawEdges);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawEdges);

  issueWaybill(run, orderNo);
}

/** 발급 연출 — 이 운송장을 어디서 얻었는지 한 번만 보여준다 (ADR-024 ②).
 *  state.js 는 손대지 않는다. run 객체에 waybillIssued 를 얹어 saveRun 으로 남긴다. */
function issueWaybill(run, orderNo) {
  if (run.waybillIssued) return;
  run.waybillIssued = true;      // 표시 시점에 바로 기록한다 — 건너뛰든 새로고침하든 두 번은 없다
  RH.saveRun(run);
  // 모션 최소화 환경에서도 대사는 읽혀야 한다 — 연출은 그대로 띄우되
  // CSS 미디어 쿼리가 애니메이션을 걷어 완성 상태로 바로 세운다

  document.body.insertAdjacentHTML('beforeend', `
    <div class="issue" id="issue" role="dialog" aria-label="운송장 발급">
      <div class="plate" aria-hidden="true"></div>
      <div class="vig" aria-hidden="true"></div>
      <div class="slip hit">
        <span class="lb">운송장 번호</span>
        <b class="mono">${esc(orderNo)}</b>
        <div class="code" aria-hidden="true"></div>
        <div class="to">받는 사람 · 6F 지배인실 — 관계자 외 출입 금지</div>
        <div class="seal">무단<br>조회</div>
      </div>
      <div class="lines">
        <p>창구 너머로 장갑 낀 손이 종이 한 장을 밀어 놓는다.</p>
        <p class="say"><b>택배좌</b>배송 오류입니다. 종종 있는 일이고요.</p>
        <p class="say"><b>택배좌</b>조회만 하십시오. 서명은 하지 마시고.</p>
      </div>
      <div class="skip">클릭 · Esc — 건너뛰기</div>
    </div>`);

  const el = document.getElementById('issue');
  let done = false;
  const close = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    document.removeEventListener('keydown', onKey);
    el.classList.add('out');
    setTimeout(() => el.remove(), 460);
  };
  const onKey = (e) => { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') close(); };
  const timer = setTimeout(close, 5200);
  el.addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  window.RH_MAP_INTRO = { close };   // 자동화(E2E·스크린샷)에서 즉시 걷어낼 수 있게 둔다
}
</script>
<script src="debug.js"></script>
</body>
