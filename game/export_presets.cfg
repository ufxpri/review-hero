; 이세계 리뷰용사 — 내보내기 프리셋 (ADR-029 5차)
;
; 웹은 만들지 않는다: Godot 4 의 Web 내보내기는 C#(.NET)을 지원하지 않는다. 데스크톱만 대상이다.
;
; ★ include_filter 의 *.yaml 이 핵심이다 ★
;   design/*.yaml 은 Godot 이 아는 리소스 형식이 아니라 임포트되지 않는다. export_filter=
;   "all_resources" 는 임포트된 리소스만 담으므로, 이 필터가 없으면 game/data/*.yaml 이
;   .pck 에 빠지고 내보낸 실행 파일이 데이터 없이 뜬다(GameData 가 design/ 폴백을 시도하다
;   DirectoryNotFoundException). 파일을 옮기거나 늘릴 때 이 줄을 같이 손볼 것.
;
; game/data/*.yaml 은 design/ 정본으로 건 파일 단위 심볼릭 링크다(사본 금지 — 밸런스 정본은
; 계속 design/ 하나뿐이어야 한다). Godot 의 파일 스캔은 링크를 따라간다 — 실측 확인됨.
;
; 내보내기 (출력 디렉터리를 미리 만들어야 한다 — Godot 은 없는 폴더를 만들지 않는다):
;   export PATH="$HOME/.dotnet:$PATH"
;   mkdir -p build/macos
;   ~/Applications/Godot_mono.app/Contents/MacOS/Godot --headless --path game \
;       --export-release "macOS" ../build/macos/ReviewHero.app
;   "build/macos/ReviewHero.app/Contents/MacOS/이세계 리뷰용사" --headless -- --autoplay
;
; arm64/universal 은 project.godot 의 textures/vram_compression/import_etc2_astc=true 가
; 켜져 있어야 한다(꺼져 있으면 export 가 설정 오류로 거부).

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.yaml"
exclude_filter=""
; 출력은 반드시 game/ 바깥이다. 프로젝트 안에 두면 그 산출물이 res:// 로 다시 스캔돼
; 다음 내보내기의 .pck 안에 지난 빌드가 통째로 들어간다(실측: icon.icns 가 팩에 잡혔다).
export_path="../build/macos/ReviewHero.app"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

