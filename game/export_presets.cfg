; .NET 런타임 dylib 26개를 서명하지 않아 macOS(AMFI)가 실행 즉시 SIGKILL 한다 —
; 빌드는 성공하는데 앱이 뜨지도 않는다. 시스템 codesign 은 중첩 바이너리까지 서명한다.
; 배포용 서명·공증은 Developer ID 가 생긴 뒤 identity/apple_team_id 를 채울 것.
